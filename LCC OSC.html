<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no / maximum-scale=1.0 are intentional here, not an oversight: this is a
     fixed-layout tablet kiosk app for the OSC station, and an accidental pinch-zoom mid-incident
     would distort the touch UI (buttons drifting under fingers) at exactly the wrong moment.
     Linters (webhint's viewport hint) flag this as an accessibility concern (WCAG 1.4.4 — users
     who need to zoom can't), which is a fair point in general, but doesn't apply well to a
     purpose-built kiosk device operated by trained crew rather than the public. Same choice as
     LCC sentinel 3 — revisit if this ever runs on a general-purpose/BYOD device instead of a
     dedicated tablet. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LCC OSC</title>
<meta name="theme-color" content="#06111F">
<link rel="manifest" href="manifest-osc.json">
<link rel="icon" href="assets/img/general/LOGO_CC_RGBv2.ico">
<link rel="apple-touch-icon" href="assets/img/general/icon-192.png">
<style>
/* ============================================================
   LCC OSC — On-Scene Coordinator tablet companion to LCC Sentinel 3
   Single self-contained file. Shares network protocol + PIN (3003)
   with sentinel_server.py so team/fire-sit/medical/plans state stays
   live-synced with LCC Sentinel 3 and the other Sentinel stations.
   ============================================================ */
:root{
  --oe-navy:#06111F; --oe-navy-mid:#0B1A2E; --oe-navy-light:#112640; --oe-navy-border:#1A3A5C;
  --ui-scale:1; --font-scale:1;
  --oe-gold:#5CB8D6; --oe-gold-light:#8DD5ED; --oe-gold-dim:#367A94;
  --oe-cream:#E4EEF4; --oe-cream-dim:#8BA5B8; --oe-white:#FFFFFF;
  --fire-primary:#8B1A1A; --fire-light:#C0392B; --fire-glow:rgba(139,26,26,0.3);
  --medical-primary:#8B0000; --medical-light:#D32F2F; --medical-glow:rgba(211,47,47,0.3);
  --protect-light:#BB86FC;
  --status-ok:#27AE60; --status-warn:#F39C12; --status-danger:#E74C3C; --status-info:#2980B9; --status-inactive:#4A5568;
  --font-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-ui:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --font-mono:'JetBrains Mono','Consolas','Courier New',monospace;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:20px;
  --transition-fast:150ms ease; --transition-mid:300ms ease;
  --shadow-gold:0 0 20px rgba(92,184,214,0.25); --shadow-card:0 4px 24px rgba(0,0,0,0.5); --shadow-deep:0 8px 40px rgba(0,0,0,0.7);
  --sidebar-width:64px; --header-height:52px;
}
:root[data-theme="light"]{
  --oe-navy:#EEF3F7; --oe-navy-mid:#FFFFFF; --oe-navy-light:#F5F8FA; --oe-navy-border:#C7D6E0;
  --oe-gold:#0F6E93; --oe-gold-light:#128AB8; --oe-gold-dim:#0B4E68;
  --oe-cream:#0E2233; --oe-cream-dim:#4C6478; --oe-white:#0E2233;
  --shadow-card:0 4px 18px rgba(15,60,90,0.12); --shadow-deep:0 8px 30px rgba(15,60,90,0.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{
  background:var(--oe-navy); color:var(--oe-cream); font-family:var(--font-ui);
  overflow:hidden; -webkit-user-select:none; user-select:none; font-size:calc(16px * var(--font-scale));
}
#ui-shell{
  position:fixed; inset:0; overflow:hidden; transform:scale(var(--ui-scale)); transform-origin:top left;
  width:calc(100% / var(--ui-scale)); height:calc(100% / var(--ui-scale));
}
.display-scale-btn{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--oe-cream-dim);font-size:11px;font-weight:700;cursor:pointer;min-width:52px;text-align:center;}
.display-scale-btn.active{background:rgba(92,184,214,0.16);border-color:rgba(92,184,214,0.4);color:var(--oe-gold);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--oe-navy-border);border-radius:4px;}
button,input,select,textarea{font-family:var(--font-ui);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Splash ── */
#splash-screen{position:fixed;inset:0;background:var(--oe-navy);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease;}
#splash-screen .splash-icon{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(92,184,214,0.35));}
#splash-screen .splash-title{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:0.12em;color:var(--oe-gold);}
#splash-screen .splash-sub{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--oe-cream-dim);}
.splash-spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(92,184,214,0.2);border-top-color:var(--oe-gold);animation:spin 0.8s linear infinite;margin-top:8px;}

/* ── Login (PIN) ── */
.login-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%, var(--oe-navy-light), var(--oe-navy));z-index:9000;display:none;align-items:center;justify-content:center;}
.login-overlay.show{display:flex;}
.login-card{width:min(380px,88vw);background:var(--oe-navy-mid);border:1px solid var(--oe-navy-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-deep);padding:28px 24px;text-align:center;}
.login-title{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--oe-gold);letter-spacing:0.08em;}
.login-role{margin-top:2px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fire-light);font-weight:700;}
.login-pin-dots{display:flex;gap:12px;justify-content:center;margin:22px 0 14px;}
.login-pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--oe-navy-border);transition:all .15s;}
.login-pin-dot.filled{background:var(--oe-gold);border-color:var(--oe-gold);}
.login-pin-dot.err{border-color:var(--status-danger);background:var(--status-danger);}
#login-error{min-height:16px;font-size:11px;color:var(--status-danger);font-weight:700;letter-spacing:0.05em;margin-bottom:6px;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pin-key{min-height:64px;border-radius:var(--radius-md);border:1px solid var(--oe-navy-border);background:rgba(255,255,255,0.04);color:var(--oe-cream);font-size:22px;font-weight:700;cursor:pointer;transition:all .1s;}
.pin-key:active{background:rgba(92,184,214,0.18);transform:scale(0.96);}
.pin-key.wide{font-size:13px;letter-spacing:0.08em;color:var(--oe-cream-dim);}
.login-hint{margin-top:16px;font-size:9px;color:var(--oe-cream-dim);letter-spacing:0.05em;}

/* ── App shell ── */
#app{position:fixed;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .4s ease;}
#app.visible{display:flex;opacity:1;}
.app-header{
  height:var(--header-height);flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(180deg,var(--oe-navy-mid),var(--oe-navy));border-bottom:1px solid rgba(92,184,214,0.15);
  z-index:60;
}
.header-brand{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.header-brand img{height:26px;width:26px;object-fit:contain;}
.header-brand-text{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.08em;color:var(--oe-gold);}
.header-clock{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--oe-cream);margin-left:auto;text-align:right;}
.header-date{font-size:8px;color:var(--oe-cream-dim);text-align:right;letter-spacing:0.05em;}
.header-network{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);cursor:pointer;flex-shrink:0;}
.network-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.network-dot.anim{animation:pulse 1.2s ease-in-out infinite;}
.net-label{font-size:9px;font-weight:700;letter-spacing:0.04em;white-space:nowrap;color:var(--oe-cream-dim);}
.header-icon-btn{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:var(--oe-cream);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative;font-size:16px;}
.header-icon-btn:active{background:rgba(92,184,214,0.18);}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--status-danger);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.header-profile{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:999px;background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.35);flex-shrink:0;cursor:pointer;}
.profile-avatar{width:28px;height:28px;border-radius:50%;background:var(--fire-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
.profile-role{font-size:9px;font-weight:700;color:var(--fire-light);letter-spacing:0.05em;}

.app-body{flex:1;display:flex;overflow:hidden;}
.app-sidebar{width:var(--sidebar-width);flex-shrink:0;background:linear-gradient(180deg,var(--oe-navy-mid),var(--oe-navy));border-right:1px solid rgba(92,184,214,0.15);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:3px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.app-sidebar::-webkit-scrollbar{display:none;}
.sidebar-item{width:52px;height:50px;border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px solid transparent;flex-shrink:0;}
.sidebar-item:active{background:rgba(92,184,214,0.15);}
.sidebar-item.active{background:rgba(92,184,214,0.14);border-color:rgba(92,184,214,0.35);}
.sidebar-item .si-ico{font-size:17px;line-height:1;}
.sidebar-item .si-lbl{font-size:6.4px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--oe-cream-dim);text-align:center;line-height:1.05;}
.sidebar-item.active .si-lbl,.sidebar-item.active .si-ico{color:var(--oe-gold);}
.sidebar-divider{width:30px;height:1px;background:rgba(92,184,214,0.18);margin:4px 0;flex-shrink:0;}
.sidebar-spacer{flex:1;}

.page-container{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.page{display:none;width:100%;height:100%;overflow-y:auto;padding:10px;flex-direction:column;gap:10px;animation:fadeIn .25s ease;}
.page.active{display:flex;}

/* ── Shared components ── */
.card{background:var(--oe-navy-mid);border:1px solid var(--oe-navy-border);border-radius:var(--radius-md);padding:var(--sp-md);box-shadow:var(--shadow-card);}
.sec-hdr{font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--oe-gold);padding:2px 0 6px;border-bottom:1px solid rgba(92,184,214,0.15);margin-bottom:8px;}
.page-title-row{display:flex;align-items:center;gap:10px;padding:2px 2px 0;flex-shrink:0;}
.page-title-ico{font-size:26px;}
.page-title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:0.03em;}
.page-sub{font-size:10px;color:var(--oe-cream-dim);letter-spacing:0.04em;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;min-height:44px;}
.btn-gold{background:linear-gradient(135deg,var(--oe-gold),var(--oe-gold-dim));color:#06111F;}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--oe-cream);border:1px solid rgba(255,255,255,0.12);}
.btn-danger{background:var(--fire-primary);color:#fff;}
.btn-block{width:100%;}

.sit-field{margin-bottom:10px;}
.sit-label{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--oe-gold-dim);margin-bottom:3px;display:block;}
.sit-row{display:flex;align-items:center;gap:6px;}
.sit-ts{font-family:var(--font-mono);font-size:9px;color:var(--oe-gold-dim);margin-left:auto;}
.sit-value{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:9px 11px;font-size:14px;color:var(--oe-cream);min-height:20px;}
.sit-value.empty{color:var(--oe-cream-dim);font-style:italic;}
.sit-input{background:rgba(255,255,255,0.05);border:1px solid var(--oe-navy-border);border-radius:6px;color:var(--oe-cream);font-size:14px;padding:9px 11px;width:100%;outline:none;}
.sit-input:focus{border-color:var(--oe-gold-dim);}

/* Fire/Protection team card (large, single-card page) */
.team-page-card-shell{display:flex;flex:1;min-height:0;}
.team-page-card-shell > .ftc{flex:1;min-height:0;}
.ftc{background:var(--oe-navy-mid);border:1px solid var(--oe-navy-border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--oe-navy-border);min-height:0;}
.ftc.ptc{background:rgba(187,134,252,0.06);}
.ftc-member-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.ftc-member-grid.two-cols{grid-template-columns:repeat(2,minmax(0,1fr));}
.ftc-member-btn{min-height:56px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:var(--oe-cream-dim);font-size:13px;font-weight:700;text-align:center;cursor:pointer;}
.ftc-member-btn.on-ok{background:rgba(39,174,96,0.2);color:var(--status-ok);border-color:var(--status-ok);}
.ftc-member-btn.on-missing{background:rgba(231,76,60,0.2);color:var(--status-danger);border-color:var(--status-danger);}
.ftc-status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ftc-status-row.pt{grid-template-columns:repeat(3,1fr);}
.ftc-btn{min-height:58px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:var(--oe-cream-dim);font-size:14px;font-weight:800;letter-spacing:0.04em;cursor:pointer;}
.ftc-btn.act-standby{background:rgba(39,174,96,0.22);color:var(--status-ok);border-color:var(--status-ok);}
.ftc-btn.act-o2{background:rgba(230,126,34,0.22);color:#E67E22;border-color:#E67E22;}
.ftc-btn.act-active{background:rgba(41,128,185,0.22);color:#5DADE2;border-color:#2980B9;}
.ftc-btn.act-purple{background:rgba(187,134,252,0.22);color:#BB86FC;border-color:#BB86FC;}
.ftc-btn.act-casualty{background:rgba(192,57,43,0.22);color:#E74C3C;border-color:#C0392B;}
.ftc-pressure-section{display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(0,0,0,0.18);border-radius:10px;}
.ftc-pressure-title{font-size:10px;font-weight:800;letter-spacing:0.08em;color:var(--oe-gold-dim);text-transform:uppercase;}
.pressure-member-header{display:flex;align-items:center;gap:8px;}
.pressure-member-lbl{font-family:var(--font-mono);font-weight:700;font-size:12px;color:var(--oe-cream-dim);}
.pressure-val-badge{font-family:var(--font-mono);font-size:18px;font-weight:800;margin-left:auto;}
.pressure-unit{font-size:10px;color:var(--oe-cream-dim);}
.pressure-slider{width:100%;height:10px;-webkit-appearance:none;appearance:none;border-radius:5px;outline:none;background:linear-gradient(to right,var(--pslider-fill,#22c55e) var(--pslider-pct,0%),rgba(255,255,255,0.08) var(--pslider-pct,0%));}
.pressure-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid var(--pslider-fill,#22c55e);}
.ftc-o2{display:none;text-align:center;padding:8px;background:rgba(230,126,34,0.08);border:1px solid rgba(230,126,34,0.25);border-radius:8px;}
.ftc-o2.show{display:block;}
.ftc-o2-time{font-family:var(--font-mono);font-size:22px;font-weight:800;}
.ftc-o2-time.safe{color:var(--status-ok);}
.ftc-o2-time.caution{color:var(--status-warn);animation:pulse 1.5s ease-in-out infinite;}
.ftc-o2-time.danger{color:var(--status-danger);animation:blink .5s step-end infinite;}
.ftc-loc{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--oe-cream);font-size:14px;padding:9px 10px;outline:none;}
.ftc-note{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--oe-cream);font-size:13px;padding:8px 10px;resize:none;height:44px;outline:none;font-family:var(--font-ui);}
.ftc-log-btn{padding:0 12px;min-height:44px;background:rgba(92,184,214,0.1);border:1px solid rgba(92,184,214,0.28);border-radius:8px;color:var(--oe-gold);font-size:12px;font-weight:800;cursor:pointer;}
.ftc-loc-picker{min-height:50px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-size:12px;letter-spacing:0.03em;}
.ftc-loc-picker .ico{font-size:16px;line-height:1;}
.ftc-hist{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto;}
.ftc-hi{font-size:12px;color:var(--oe-cream-dim);padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.35;}
.ftc-ht{font-family:var(--font-mono);color:var(--oe-gold-dim);margin-right:6px;font-size:11px;}

/* Team roster (Meeting Point) */
.team-row{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);}
.team-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.team-name{font-size:13px;font-weight:800;flex:1;}
.team-btns{display:flex;gap:5px;}
.tbtn{padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:transparent;font-size:11px;font-weight:800;cursor:pointer;color:var(--oe-cream-dim);min-height:38px;}
.tbtn.on-ok{background:rgba(39,174,96,0.2);color:var(--status-ok);border-color:var(--status-ok);}
.tbtn.on-missing{background:rgba(231,76,60,0.2);color:var(--status-danger);border-color:var(--status-danger);}
.team-missing{display:flex;flex-wrap:wrap;gap:5px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.06);}
.missing-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.3);border-radius:999px;font-size:10px;color:var(--status-danger);}
.missing-chip button{background:none;border:none;color:var(--status-danger);font-size:13px;cursor:pointer;padding:0;line-height:1;}

/* Evacuation zone grid */
.evac-zone-list{display:flex;flex-wrap:wrap;gap:6px;}
.evac-zone-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);font-size:11px;font-weight:700;}
.evac-zone-chip.st-evacuated{background:rgba(39,174,96,0.2);border-color:rgba(39,174,96,0.5);color:#bff2ce;}
.evac-zone-chip.st-in-progress{background:rgba(192,57,43,0.2);border-color:rgba(192,57,43,0.5);color:#ffb0a7;}
.evac-zone-grid{display:flex;flex-direction:column;gap:6px;}
.evac-zone-grid-head,.evac-zone-grid-row{display:grid;grid-template-columns:64px repeat(4,minmax(0,1fr));gap:6px;align-items:center;}
.evac-zone-grid-label{color:var(--oe-gold-dim);font-size:10px;font-weight:800;text-transform:uppercase;text-align:center;}
.evac-zone-deck{font-family:var(--font-mono);font-size:11px;font-weight:800;}
.evac-zone-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--oe-cream-dim);font-size:10px;font-weight:800;cursor:pointer;}

/* Medical */

/* Plans */

.plan-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}

.plan-status-btn.status-ras.active{background:rgba(190,190,190,0.35);}
.plan-status-btn.status-smoke.active{background:rgba(240,145,58,0.5);}
.plan-status-btn.status-fire.active{background:rgba(224,64,64,0.55);}
.plan-status-btn.status-water.active{background:rgba(68,138,255,0.5);}
.plan-status-btn.status-green.active{background:rgba(58,191,119,0.5);}
.plan-status-btn.status-violet.active{background:rgba(154,90,214,0.5);}
.plan-check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--oe-cream-dim);padding:4px 0;}
.plan-check input{width:18px;height:18px;}
.plan-icon-palette{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.plan-icon-item{border:1px solid rgba(92,184,214,0.25);border-radius:8px;background:rgba(255,255,255,0.03);min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;cursor:pointer;}
.plan-icon-item.placing{border-color:var(--oe-gold);background:rgba(92,184,214,0.2);}
.plan-token{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;line-height:1;border:1.4px solid transparent;}
.plan-token.fire{background:#cc2f2f;color:#fff;border-color:#ffd0d0;}
.plan-token.protection{background:#ffd24a;color:#192534;border-color:#8c6a00;}

/* Notification / network drawers */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:700;display:none;}
.drawer-overlay.show{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--oe-navy-mid);border-left:1px solid var(--oe-navy-border);box-shadow:var(--shadow-deep);z-index:701;padding:14px;display:flex;flex-direction:column;gap:10px;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;}
.drawer.show{transform:translateX(0);}
.drawer-close{align-self:flex-end;width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.06);border:none;color:var(--oe-cream);font-size:16px;cursor:pointer;}
.notif-entry{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:3px solid var(--oe-gold-dim);font-size:12px;line-height:1.4;}
.notif-entry .ne-time{font-family:var(--font-mono);font-size:9px;color:var(--oe-gold-dim);display:block;margin-bottom:2px;}

/* Toasts */
#toast-container{position:fixed;top:calc(var(--header-height) + 8px);right:8px;z-index:9500;display:flex;flex-direction:column;gap:6px;max-width:88vw;}
.toast{background:var(--oe-navy-mid);border:1px solid var(--oe-navy-border);border-left:3px solid var(--oe-gold);border-radius:8px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow-card);animation:fadeInUp .2s ease;}
.toast-error{border-left-color:var(--status-danger);}
.toast-warn{border-left-color:var(--status-warn);}
.toast-ok{border-left-color:var(--status-ok);}

/* Generic full-screen modal (location picker, predefined actions, member picker) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:800;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;padding:10px;}
.modal-box{background:var(--oe-navy-mid);border:1px solid var(--oe-navy-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-deep);width:min(640px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:fadeInUp .2s ease;}
.modal-header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(92,184,214,0.15);flex-shrink:0;}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--oe-gold);flex:1;}
.modal-close{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.06);border:none;color:var(--oe-cream);font-size:16px;cursor:pointer;flex-shrink:0;}
.modal-tabs{display:flex;gap:6px;padding:8px 14px 0;flex-shrink:0;}
.modal-tab{flex:1;padding:9px 6px;border-radius:8px 8px 0 0;border:1px solid rgba(255,255,255,0.1);border-bottom:none;background:rgba(255,255,255,0.03);color:var(--oe-cream-dim);font-size:12px;font-weight:800;letter-spacing:0.04em;cursor:pointer;}
.modal-tab.active{background:rgba(92,184,214,0.14);color:var(--oe-gold);}
.modal-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;}
.modal-filter-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.modal-chip{padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:var(--oe-cream-dim);font-size:11px;font-weight:700;cursor:pointer;}
.modal-chip.active{background:rgba(92,184,214,0.2);border-color:var(--oe-gold-dim);color:var(--oe-gold);}
.loc-list{display:flex;flex-direction:column;gap:4px;}
.loc-list-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);cursor:pointer;font-size:13px;text-align:left;width:100%;}
.loc-list-item .loc-badge{font-family:var(--font-mono);font-size:9px;font-weight:800;color:var(--oe-gold-dim);background:rgba(92,184,214,0.1);border-radius:4px;padding:2px 6px;flex-shrink:0;}
.loc-list-item.on-ok{background:rgba(39,174,96,0.16);border-color:var(--status-ok);}
.loc-list-item.on-ok .loc-badge{color:var(--status-ok);background:rgba(39,174,96,0.15);}
.loc-list-item.on-missing{background:rgba(231,76,60,0.16);border-color:var(--status-danger);}
.loc-list-item.on-missing .loc-badge{color:var(--status-danger);background:rgba(231,76,60,0.15);}
.predef-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.predef-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;border-left-width:4px;border-left-style:solid;background:rgba(255,255,255,0.03);border-top:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;font-weight:600;cursor:pointer;text-align:left;}
.modal-plan-viewer{position:relative;height:min(50vh,420px);border-radius:10px;border:1px solid var(--oe-navy-border);background:#0c1620;overflow:hidden;touch-action:none;flex-shrink:0;}
.modal-plan-viewer canvas{position:absolute;top:0;left:0;}
.modal-plan-hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(10,20,35,0.85);border:1px solid var(--oe-gold-dim);border-radius:6px;padding:4px 10px;font-size:10px;color:var(--oe-gold);pointer-events:none;}
.modal-plan-feedback{position:absolute;top:8px;left:50%;transform:translateX(-50%);min-height:20px;padding:2px 10px;border-radius:999px;border:1px solid transparent;background:rgba(8,18,30,0.2);font-size:11px;line-height:16px;pointer-events:none;white-space:nowrap;}
.modal-plan-feedback.ok{color:#c8f5d9;border-color:rgba(88,196,130,0.55);background:rgba(18,58,34,0.72);}
.modal-plan-feedback.warn{color:#ffe1a6;border-color:rgba(232,176,64,0.6);background:rgba(64,42,14,0.76);}

/* Utility classes — deduplicate the last few static inline styles */
.u-bg-status-warn{background:var(--status-warn);}
.u-hidden{display:none;}
.u-text-right{text-align:right;}
.u-net-status-text{font-size:12px;color:var(--oe-cream-dim);}
.u-mt-8{margin-top:8px;}
.u-fs11-dim{font-size:11px;color:var(--oe-cream-dim);}
.u-col-gap6{display:flex;flex-direction:column;gap:6px;}
.u-chat-drawer-width{width:min(400px,92vw);}
.u-col-gap4{display:flex;flex-direction:column;gap:4px;}
.u-chat-log{display:flex;flex-direction:column-reverse;gap:4px;flex:1;overflow-y:auto;min-height:120px;}

/* Portrait / touch tuning */
@media (max-width:900px){
  .ftc-member-btn{min-height:62px;}
  .ftc-btn{min-height:64px;font-size:15px;}
  .tbtn{min-height:44px;font-size:12px;}
}
</style>

  // Per-team, per-field "when did WE last touch this locally" timestamps (ms epoch) — lets
  // applySnapshot() merge an incoming update field-by-field instead of replacing a whole team
  // object wholesale. Without this, two edits to the SAME team on two different stations within
  // one ~5s sync cycle race: whichever side's periodic snapshot lands on the server last simply

  // stale copy still has the old status — A's next sync wipes B's change). Same technique

/* Last full snapshot received from the network — kept verbatim so our own
   STATE_SYNC never truncates branches (polar/muster/abandon/…) we don't manage. */
let lastKnownFullSnapshot = null;

function nowTime(){ return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

/* Records that `fields` on team `id` (in touched map `bucket`, e.g. STATE.touched.fireTeams)
   were just edited locally — call this from every mutator right before syncing. */
function touchFields(bucket, id, fields){
  bucket[id] = bucket[id] || {};
  const now = Date.now();
  fields.forEach(f => { bucket[id][f] = now; });
}

/* Field-level merge of a team array against an incoming (network) copy — a proper per-field
   Last-Write-Wins register, not just "trust whatever the snapshot's overall timestamp says".

   HISTORY / why this looks the way it does: the first version compared a field's local touch
   time only against the *whole snapshot's* capture time (incomingUpdatedAt). A stress test with
   5 stations firing simultaneous conflicting edits found that this isn't enough: a bystander
   station that never touched a field would still blindly relay its own (possibly stale) copy of
   it on its next periodic sync, stamped with a BRAND NEW server timestamp — and because that
   timestamp looks "newer" to every other station, a live edit could get silently reverted to
   stale/blank data purely because an uninvolved relay happened to sync at the wrong moment.
   Recording "when did I last accept a value for this field" (touchedBucket) closed part of the
   gap, but not all of it: the relay's OWN recorded time was still "now" (when it accepted/relayed
   the value), not the TRUE original edit time — so a slightly-later relay could still outrank a
   genuinely fresher edit that just hadn't reached the relay yet. Reproduced concretely: two
   stations racing to set a team's location both got silently reverted to "" this way.

   Fix: incoming[idKey]Touched (attached to each team object by buildStateSnapshot, mirroring
   this station's own touched-bucket) carries the field's TRUE origin timestamp along with the
   value, end to end, however many relays it passes through. Merge compares against THAT — not
   the coarse whole-snapshot time — and forwards the true origin time (not "now") when adopting
   an incoming value, so downstream stations keep making the correct comparison too. */
function mergeTeamArray(localArr, incomingArr, touchedBucket, incomingUpdatedAt, idKey){
  idKey = idKey || 'id';
  if (!Array.isArray(incomingArr)) return localArr;
  if (!incomingUpdatedAt) return incomingArr;
  const localById = {};
  (localArr || []).forEach(item => { localById[item[idKey]] = item; });
  return incomingArr.map(incoming => {
    const id = incoming[idKey];
    const local = localById[id];
    if (!local) return incoming;
    const touched = touchedBucket[id] = touchedBucket[id] || {};
    const incomingTouched = (incoming.__touchedAt) || {};
    const merged = { ...incoming };
    delete merged.__touchedAt;
    Object.keys(local).forEach(field => {
      const fieldOriginAt = incomingTouched[field] || incomingUpdatedAt; // true origin time if carried, else fall back to the relay's own timestamp
      if ((touched[field] || 0) > fieldOriginAt) merged[field] = local[field];
      else touched[field] = fieldOriginAt; // forward the TRUE origin time, not "now"
    });
    return merged;
  });
}
/* Attaches this station's own per-field touched-timestamps to each outgoing team object (as
   __touchedAt), so mergeTeamArray on the receiving end can compare against the field's TRUE
   origin time instead of just this send's timestamp. Stripped back off by mergeTeamArray before
   the data is used anywhere else — it's wire metadata, not part of the real team shape. */
function withTouchedAt(arr, touchedBucket, idKey){
  idKey = idKey || 'id';
  return (arr || []).map(item => ({ ...item, __touchedAt: touchedBucket[item[idKey]] || {} }));
}
function getCrewMap(){
  const map = {};
  if (window.OE_CREW && Array.isArray(window.OE_CREW.crew)) window.OE_CREW.crew.forEach(c => { map[c.safetyNumber] = c; });
  return map;
}

    tick(); setInterval(tick, 1000);
  },
  toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    this.applyTheme(cur === 'light' ? 'dark' : 'light');
  },
  applyTheme(theme){
    if (theme === 'light') document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('lcc_osc_theme', theme);
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
  },
  getDisplaySettings(){
    const fontScale = Number(localStorage.getItem('lcc_osc_font_scale') || '1');
    const uiScale = Number(localStorage.getItem('lcc_osc_ui_scale') || '1');
    return {
      fontScale: Number.isFinite(fontScale) && fontScale > 0 ? fontScale : 1,
      uiScale: Number.isFinite(uiScale) && uiScale > 0 ? uiScale : 1,
    };
  },
  applyDisplaySettings(settings){
    const base = this.getDisplaySettings();
    const next = { ...base, ...(settings || {}) };
    const fontScale = Math.max(0.8, Math.min(1.4, Number(next.fontScale) || 1));
    const uiScale = Math.max(0.8, Math.min(1.4, Number(next.uiScale) || 1));
    document.documentElement.style.setProperty('--font-scale', String(fontScale));
    document.documentElement.style.setProperty('--ui-scale', String(uiScale));
    localStorage.setItem('lcc_osc_font_scale', String(fontScale));
    localStorage.setItem('lcc_osc_ui_scale', String(uiScale));
    this.updateDisplayButtons(fontScale, uiScale);
  },
  setDisplayScale(kind, value){
    const current = this.getDisplaySettings();
    this.applyDisplaySettings(kind === 'font' ? { ...current, fontScale: value } : { ...current, uiScale: value });
  },
  resetDisplaySettings(){
    this.applyDisplaySettings({ fontScale: 1, uiScale: 1 });
  },
  updateDisplayButtons(fontScale, uiScale){
    document.querySelectorAll('[data-display-scale-role="font"]').forEach(btn => {
      const val = Number(btn.getAttribute('data-display-scale-value'));
      btn.classList.toggle('active', Math.abs(val - fontScale) < 0.001);
    });
    document.querySelectorAll('[data-display-scale-role="ui"]').forEach(btn => {
      const val = Number(btn.getAttribute('data-display-scale-value'));
      btn.classList.toggle('active', Math.abs(val - uiScale) < 0.001);
    });
  },
  showToast(msg, type){
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast-' + type : '');

  notify(text, type){

  // Top-to-bottom order (inverted on request from the original bottom-up reading).
  SIDEBAR: [
    { group:'main', id:'meeting', ico:'👥', lbl:'MTP' },
    { group:'main', id:'evac', ico:'🚨', lbl:'EVAC' },

    this.currentPage = id;
    Pages.render(id);

/* ============================================================
   Login — PIN pad, OSC profile fixed to token 3003
   ============================================================ */
const Login = {
  OSC_TOKEN: '3003',
  buffer: '',
  init(){
    const saved = localStorage.getItem('lcc_osc_profile');
    this.buildPad();
    if (saved) { this.enterApp(); return; }
    this.show();
  },
  buildPad(){
    const pad = document.getElementById('pin-pad');
    const keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
    pad.innerHTML = keys.map(k => {
      const wide = (k === 'C' || k === '⌫') ? ' wide' : '';
      return `<button class="pin-key${wide}" onclick="Login.press('${k}')">${k}</button>`;
    }).join('');
  },
  show(){ document.getElementById('login-overlay').classList.add('show'); },
  hide(){ document.getElementById('login-overlay').classList.remove('show'); },
  press(k){
    if (k === 'C') { this.buffer = ''; this.renderDots(false); return; }
    if (k === '⌫') { this.buffer = this.buffer.slice(0,-1); this.renderDots(false); return; }
    if (this.buffer.length >= 4) return;
    this.buffer += k;
    this.renderDots(false);
    if (this.buffer.length === 4) this.validate();
  },
  renderDots(err){
    const dots = document.querySelectorAll('.login-pin-dot');
    dots.forEach((d,i) => {
      d.classList.toggle('filled', i < this.buffer.length && !err);
      d.classList.toggle('err', !!err);
    });
  },
  validate(){
    if (this.buffer === this.OSC_TOKEN) {
      const profile = { id:'osc', role:'OSC', name:'On-Scene Cmdr', initials:'OS', token:this.OSC_TOKEN, color:'#C0392B' };
      localStorage.setItem('lcc_osc_profile', JSON.stringify(profile));
      this.enterApp();
    } else {
      document.getElementById('login-error').textContent = 'PIN incorrect';
      this.renderDots(true);
      setTimeout(() => { this.buffer=''; document.getElementById('login-error').textContent=''; this.renderDots(false); }, 900);
    }
  },
  enterApp(){
    this.hide();
    document.getElementById('app').classList.add('visible');
    UI.navigateTo('meeting');
    NetOSC.init();
  },
};

/* ============================================================
   NetOSC — WebSocket client, compatible with sentinel_server.py
   and LCC Sentinel 3's protocol (AUTH / STATE_SYNC / FULL_STATE).
   Snapshot pass-through avoids truncating branches (polar, muster,
   abandon, …) this app doesn't understand — see plan §6.
   ============================================================ */
const NetOSC = {
  ws: null,
  authenticated: false,
  standalone: false,
  reconnectDelay: 2000,
  reconnectTimer: null,
  syncTimer: null,
  heartbeatTimer: null,
  offlineQueue: [],
  lastSyncedJson: '',
  clients: [],

  init(){
    const host = localStorage.getItem('lcc_osc_net_host') || '';
    document.getElementById('net-host-input').value = host;
    if (localStorage.getItem('lcc_osc_standalone') === '1' || !host) { this.goStandalone(true); return; }
    this.connect(host);
  },
  // A corrupted/malformed 'lcc_osc_profile' entry (bad browser storage, stale format from an old
  // build, third-party storage sanitizer…) must never throw here: connect() and send() both call
  // this on the hot path, and an uncaught SyntaxError inside connect() permanently kills the
  // reconnect loop (scheduleReconnect never gets called again) — the app goes silently offline
  // forever until a manual reload. Same for send(): every outgoing message would throw.
  getStoredProfile(){
    try { return JSON.parse(localStorage.getItem('lcc_osc_profile') || '{}') || {}; }
    catch(e) { return {}; }
  },
  toggleDrawer(){
    const show = !document.getElementById('net-drawer').classList.contains('show');
    document.getElementById('net-drawer').classList.toggle('show', show);
    document.getElementById('net-drawer-overlay').classList.toggle('show', show);
    if (show) this.renderDrawer();
  },
  closeDrawer(){
    document.getElementById('net-drawer').classList.remove('show');
    document.getElementById('net-drawer-overlay').classList.remove('show');
  },
  renderDrawer(){
    const status = document.getElementById('net-drawer-status');
    status.textContent = this.standalone ? 'Mode Standalone — aucune connexion serveur.' :
      (this.authenticated ? 'Connecté et authentifié.' : 'Connexion en cours…');
    document.getElementById('net-drawer-clients').textContent = this.clients.length
      ? this.clients.map(c => c.role || c.name || '?').join(', ') : '—';
  },
  applyHostAndConnect(){
    const host = document.getElementById('net-host-input').value.trim();
    if (!host) return;
    localStorage.setItem('lcc_osc_net_host', host);
    localStorage.setItem('lcc_osc_standalone', '0');
    this.standalone = false;
    this.connect(host);
    this.closeDrawer();
  },
  goStandalone(silent){
    this.standalone = true;
    localStorage.setItem('lcc_osc_standalone', '1');
    if (this.ws) { try { this.ws.close(); } catch(e){} this.ws = null; }
    clearTimeout(this.reconnectTimer);
    this.updateHeaderUI('standalone');
    if (!silent) this.closeDrawer();
  },
  connect(host){
    this.standalone = false;
    this.updateHeaderUI('connecting');
    const profile = this.getStoredProfile();
    const token = String(profile.token || '').trim();
    if (!token) {
      this.standalone = true;
      localStorage.setItem('lcc_osc_standalone', '1');
      this.updateHeaderUI('standalone');
      UI.notify('Connexion bloquee: token OSC vide. Reconnectez-vous via le PIN OSC.');
      return;
    }
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    let url = host.includes('://') ? host : `${scheme}://${host}`;
    try {
      this.ws = new WebSocket(url);
    } catch(e) { this.scheduleReconnect(host); return; }
    this.ws.onopen = () => {
      this.reconnectDelay = 2000;
      this.sendRaw({ type:'AUTH', payload:{ token, profile } });
      this.startHeartbeat();
    };
    this.ws.onmessage = (ev) => { try { this.handleMessage(JSON.parse(ev.data)); } catch(e){} };
    this.ws.onclose = () => {
      this.authenticated = false;
      // Don't stomp the 'standalone' pill the AUTH_FAIL handler just set (a rejected
      // duplicate/invalid token) with a misleading red 'degraded' — this close event is
      // the server enforcing that rejection, not an unexpected network drop.
      this.updateHeaderUI(this.standalone ? 'standalone' : 'degraded');
      this.scheduleReconnect(host);
    };
    this.ws.onerror = () => {};
  },
  scheduleReconnect(host){
    clearTimeout(this.reconnectTimer);
    if (this.standalone) return;
    this.reconnectTimer = setTimeout(() => this.connect(host), this.reconnectDelay);
    this.reconnectDelay = Math.min(this.reconnectDelay * 1.5, 30000);
  },
  startHeartbeat(){
    clearInterval(this.heartbeatTimer);
    this.heartbeatTimer = setInterval(() => this.sendRaw({ type:'HEARTBEAT', payload:{} }), 5000);
  },
  startStateSync(){
    clearInterval(this.syncTimer);
    this.syncTimer = setInterval(() => {
      if (!this.authenticated) return;
      const snapshot = this.buildStateSnapshot();
      const json = JSON.stringify(snapshot);
      if (json === this.lastSyncedJson) return;
      this.lastSyncedJson = json;
      this.send({ type:'STATE_SYNC', payload:{ snapshot } });
    }, 5000);
  },
  sendRaw(packet){ if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(packet)); },
  send(data){
    const profile = this.getStoredProfile();
    const packet = { ...data, ts: new Date().toISOString(), user: profile.name || 'OSC' };
    if (this.authenticated && this.ws && this.ws.readyState === WebSocket.OPEN) this.sendRaw(packet);
    else { this.offlineQueue.push(packet); if (this.offlineQueue.length > 200) this.offlineQueue.shift(); }
  },
  flushQueue(){
    if (!this.offlineQueue.length) return;
    this.offlineQueue.forEach(p => this.sendRaw(p));
    this.offlineQueue = [];
  },
  buildStateSnapshot(){
    return {
      ...(lastKnownFullSnapshot || {}),
      fire: {
        teams: withTouchedAt(STATE.meetingTeams, STATE.touched.meetingTeams),
        fireTeams: withTouchedAt(STATE.fireTeams, STATE.touched.fireTeams),
      },
      fireSit: { fields: STATE.fireSit.fields, stamps: STATE.fireSit.stamps, evacSelected: STATE.evac.selected },
      protection: { teams: withTouchedAt(STATE.protectionTeams, STATE.touched.protectionTeams) },
      medical: { victims: STATE.medical.victims, activeVictimId: STATE.medical.activeVictimId },
      plans: { zoneStates: STATE.plans.zoneStates, markers: STATE.plans.markers, markersLocked: STATE.plans.markersLocked },
      osc: { messages: STATE.oscMessages, currentDeck: STATE.plans.currentDeck },
    };
  },
  sendStateSyncNow(){
    const snapshot = this.buildStateSnapshot();
    const json = JSON.stringify(snapshot);
    this.lastSyncedJson = json;
    this.send({ type:'STATE_SYNC', payload:{ snapshot } });
  },
  handleMessage(msg){
    switch(msg.type){
      case 'AUTH_OK':
        this.authenticated = true;
        this.clients = msg.payload?.clients || [];
        this.updateHeaderUI('online');
        this.flushQueue();
        this.sendRaw({ type:'REQUEST_SYNC' });
        this.startStateSync();
        UI.notify('Connecté au serveur Sentinel');
        break;
      case 'AUTH_FAIL': {
        // Stop auto-retrying with a token the server has just refused (e.g. a duplicate OSC
        // login, or an invalid PIN) — the previous behaviour kept reconnecting forever every
        // few seconds with the same rejected token, spamming the server log and the UI with
        // repeated failures until someone noticed. In-memory only (not persisted) so a page
        // reload or a manual "CONNECTER" from the network drawer will try again fresh.
        this.standalone = true;
        clearTimeout(this.reconnectTimer);
        this.updateHeaderUI('standalone');
        const reason = msg.payload?.reason || 'PIN invalide ou refusé par le serveur.';
        UI.notify('Connexion refusée : ' + reason, 'error');
        break;
      }
      case 'CLIENT_LIST':
        this.clients = msg.payload?.clients || msg.clients || [];
        this.updateHeaderUI('online');
        break;
      case 'FULL_STATE':
        this.applyFullState(msg.payload);
        break;
      case 'HEARTBEAT_ACK':
        break;
      case 'OSC_TEAM_UPDATE':
        this.applyTeamUpdatePayload(msg.payload);
        break;
      case 'OSC_MESSAGE':
        if (msg.payload?.text) {
          STATE.oscMessages.unshift({ time: msg.payload.time || nowTime(), text: msg.payload.text, from: msg.user || 'Bridge' });
          STATE.oscMessages = STATE.oscMessages.slice(0, 50); // bounded — this array rides every STATE_SYNC snapshot
          ChatOSC.receive();
          UI.notify(`Bridge: ${msg.payload.text}`);
        }
        break;
      case 'FIRE_SIT_UPDATE':
        this.applyFireSitPayload(msg.payload);
        break;
      default: break;
    }
  },
  applyFullState(state){
    if (!state) return;
    if (state.snapshot) {
      lastKnownFullSnapshot = state.snapshot;
      const incomingUpdatedAt = state.snapshotMeta?.updatedAt ? new Date(state.snapshotMeta.updatedAt).getTime() : 0;
      this.applySnapshot(state.snapshot, incomingUpdatedAt);
    }
  },
  applySnapshot(snapshot, incomingUpdatedAt){
    if (!snapshot || typeof snapshot !== 'object') return;
    if (snapshot.fire) {
      if (Array.isArray(snapshot.fire.teams)) STATE.meetingTeams = mergeTeamArray(STATE.meetingTeams, snapshot.fire.teams, STATE.touched.meetingTeams, incomingUpdatedAt);
      if (Array.isArray(snapshot.fire.fireTeams)) STATE.fireTeams = mergeTeamArray(STATE.fireTeams, snapshot.fire.fireTeams, STATE.touched.fireTeams, incomingUpdatedAt);
    }
    if (snapshot.fireSit) this.applyFireSitPayload(snapshot.fireSit);
    if (snapshot.protection && Array.isArray(snapshot.protection.teams)) {
      STATE.protectionTeams = mergeTeamArray(STATE.protectionTeams, snapshot.protection.teams, STATE.touched.protectionTeams, incomingUpdatedAt);
    }
    if (snapshot.medical) {
      if (Array.isArray(snapshot.medical.victims)) STATE.medical.victims = snapshot.medical.victims;
      if (snapshot.medical.activeVictimId !== undefined) STATE.medical.activeVictimId = snapshot.medical.activeVictimId;
    }
    if (snapshot.plans) {
      if (snapshot.plans.zoneStates) STATE.plans.zoneStates = snapshot.plans.zoneStates;
      if (Array.isArray(snapshot.plans.markers)) STATE.plans.markers = snapshot.plans.markers;
      if (snapshot.plans.markersLocked !== undefined) STATE.plans.markersLocked = snapshot.plans.markersLocked;
    }
    if (snapshot.osc) {
      if (Array.isArray(snapshot.osc.messages)) STATE.oscMessages = snapshot.osc.messages;
      if (snapshot.osc.currentDeck) STATE.plans.currentDeck = snapshot.osc.currentDeck;
    }
    Pages.renderActive();
  },
  applyFireSitPayload(payload){
    if (!payload) return;
    if (payload.fields) STATE.fireSit.fields = { ...STATE.fireSit.fields, ...payload.fields };
    if (payload.stamps) STATE.fireSit.stamps = { ...STATE.fireSit.stamps, ...payload.stamps };
    if (Array.isArray(payload.staircaseActive)) STATE.fireSit.staircaseActive = payload.staircaseActive;
    if (Array.isArray(payload.pressureActive)) STATE.fireSit.pressureActive = payload.pressureActive;
    if (Array.isArray(payload.fireDoorsActive)) STATE.fireSit.fireDoorsActive = payload.fireDoorsActive;
    if (Array.isArray(payload.evacSelected)) STATE.evac.selected = payload.evacSelected;
    Pages.renderIfActive('bridgeinfo');
    Pages.renderIfActive('evac');
  },
  applyTeamUpdatePayload(payload){
    if (!payload) return;
    if (Array.isArray(payload.fireTeams)) STATE.fireTeams = payload.fireTeams;
    if (Array.isArray(payload.protectionTeams)) STATE.protectionTeams = payload.protectionTeams;
    Pages.renderActive();
  },
  updateHeaderUI(mode){
    const cfg = {
      standalone: { color:'var(--status-warn)', text:'Standalone', anim:false },
      connecting: { color:'#3498db', text:'Connexion…', anim:true },
      online:     { color:'var(--status-ok)', text:`${this.clients.length} poste(s)`, anim:true },
      degraded:   { color:'var(--status-danger)', text:'Hors ligne', anim:false },
    }[mode] || { color:'var(--status-warn)', text:'Standalone', anim:false };
    const dot = document.getElementById('network-dot');
    const label = document.getElementById('net-label');
    if (dot) { dot.style.background = cfg.color; dot.classList.toggle('anim', cfg.anim); }
    if (label) label.textContent = cfg.text;
    this.renderDrawer();
  },
};

/* ============================================================
   Pages — one render function per sidebar entry
   ============================================================ */
const Pages = {
  render(id){
    // Defensive: one bad render must never take down message handling / the
    // WebSocket loop with it (a render bug here used to look like an app "crash").
    try {
      const fn = this['render_' + id];
      if (typeof fn === 'function') fn.call(this);
    } catch (e) { console.error('[Pages] render failed for', id, e); }
  },
  _pendingRenderId: null,
  _renderScheduled: false,
  /* Coalesce network-driven re-renders onto one requestAnimationFrame instead of
     rebuilding the DOM once per incoming FULL_STATE — with several stations each
     syncing every ~5s, the server can broadcast several updates per second, and a
     full-page rebuild on every single one is what caused the OSC tablet to bog
     down / crash during sustained multi-station use (see plans page listener leak
     fix below too). */
  _scheduleRender(id){
    this._pendingRenderId = id;
    if (this._renderScheduled) return;
    this._renderScheduled = true;
    requestAnimationFrame(() => {
      this._renderScheduled = false;
      const target = this._pendingRenderId;
      this._pendingRenderId = null;
      if (!target) return;
      // Plans is the one page with an interactive canvas (pan/zoom) and a free-text
      // zone-id input — tearing the whole page down and rebuilding it on every remote
      // update destroys that in-progress interaction (and was the source of the
      // resize-listener leak below). A network-driven refresh only needs to redraw
      // the canvas + tactical panel, not rebuild the DOM.
      if (target === 'plans' && document.getElementById('plan-canvas')) {
        try { PlansOSC.redraw(); PlansOSC.refreshTacticalPanel(); }
        catch (e) { console.error('[Pages] plans soft-refresh failed', e); }
        return;
      }
      this.render(target);
    });
  },
  renderActive(){ if (UI.currentPage) this._scheduleRender(UI.currentPage); },
  renderIfActive(id){ if (UI.currentPage === id) this._scheduleRender(id); },

  /* ── Meeting Point ── */
  render_meeting(){
    const page = document.getElementById('page-meeting');
    const sorted = [...STATE.meetingTeams].sort((a,b) => a.name.localeCompare(b.name));
    page.innerHTML = `
      <div class="page-title-row"><span class="page-title-ico">👥</span><div><div class="page-title">Meeting Point</div><div class="page-sub">Roster complet des équipes — présence</div></div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${sorted.map(t => this.teamRowHtml(t)).join('')}
      </div>`;
  },
  teamRowHtml(t){
    const missing = (t.missing || []).map(sn => `<span class="missing-chip">${crewLabel(sn)}<button onclick="MeetingOSC.removeMissing('${t.id}','${sn}');event.stopPropagation()">×</button></span>`).join('');
    return `
    <div class="team-row" data-team="${t.id}">
      <div class="team-row-top">
        <span class="team-name">${escapeHtml(t.name)}</span>
        <div class="team-btns">
          <button class="tbtn ${t.status==='complete'?'on-ok':''}" onclick="MeetingOSC.setStatus('${t.id}','complete')">COMPLETE</button>
          <button class="tbtn ${t.status==='missing'?'on-missing':''}" onclick="MeetingOSC.setStatus('${t.id}','missing')">MISSING</button>
          ${t.members.length ? `<button class="tbtn" onclick="MeetingOSC.openMemberModal('${t.id}')">👥 Crew</button>` : ''}
        </div>
      </div>
      ${missing ? `<div class="team-missing">${missing}</div>` : ''}
    </div>`;
  },

  /* ── Evacuation ── */
  render_evac(){
    const page = document.getElementById('page-evac');
    const head = `<div class="evac-zone-grid-head"><div class="evac-zone-grid-label">Pont</div>${STATE.evac.mvzs.map(m=>`<div class="evac-zone-grid-label">${m}</div>`).join('')}</div>`;
    const rows = STATE.evac.decks.map(deck => {
      const cells = STATE.evac.mvzs.map(mvz => {
        const found = STATE.evac.selected.find(z => z.deck===deck && z.mvz===mvz);
        const state = found ? found.status : 'neutral';
        const label = state==='evacuated' ? 'EVACUATED' : state==='in-progress' ? 'IN PROGRESS' : '—';
        return `<button class="evac-zone-btn state-${state}" onclick="EvacOSC.toggleZone('${deck}','${mvz}')"><span>${mvz.replace('MVZ ','MVZ')}</span><span>${label}</span></button>`;
      }).join('');
      return `<div class="evac-zone-grid-row"><div class="evac-zone-deck">${deck}</div>${cells}</div>`;
    }).join('');
    const chips = STATE.evac.selected.length ? STATE.evac.selected.map(z => `<span class="evac-zone-chip st-${z.status}">${z.deck} ${z.mvz} — ${z.status==='evacuated'?'EVACUATED':'IN PROGRESS'}</span>`).join('') : '<span style="color:var(--oe-cream-dim);font-size:11px">Aucune zone sélectionnée</span>';
    page.innerHTML = `
      <div class="page-title-row"><span class="page-title-ico">🚨</span><div><div class="page-title">Evacuation Zones</div><div class="page-sub">Tap: neutre → en cours → évacuée → neutre</div></div></div>
      <div class="card"><div class="sec-hdr">ZONES SÉLECTIONNÉES</div><div class="evac-zone-list">${chips}</div>
        <button class="btn btn-ghost u-mt-8" onclick="EvacOSC.clearAll()">RESET</button>
      </div>
      <div class="card" style="flex:1;overflow-y:auto"><div class="evac-zone-grid">${head}${rows}</div></div>`;
  },

/* ============================================================
   MeetingOSC — team roster (Meeting Point page)
   ============================================================ */
const MeetingOSC = {
  find(id){ return STATE.meetingTeams.find(t => t.id === id); },
  touch(id, ...fields){ touchFields(STATE.touched.meetingTeams, id, fields); },
  setStatus(id, status){
    const t = this.find(id); if (!t) return;
    t.status = status;
    if (status === 'complete') { t.missing = []; t.members.forEach(sn => { t.memberStates = t.memberStates||{}; t.memberStates[sn] = 'complete'; }); }
    this.touch(id, 'status', 'missing', 'memberStates');
    this.sync(); Pages.render_meeting();
  },
  cycleMember(teamId, sn){
    const t = this.find(teamId); if (!t) return;
    t.memberStates = t.memberStates || {};
    const cur = t.memberStates[sn] || 'pending';
    const next = cur === 'pending' ? 'complete' : cur === 'complete' ? 'missing' : 'pending';
    t.memberStates[sn] = next;
    t.missing = t.members.filter(m => t.memberStates[m] === 'missing');
    t.status = t.missing.length ? 'missing' : (t.members.every(m => t.memberStates[m]==='complete') ? 'complete' : t.status);
    this.touch(teamId, 'status', 'missing', 'memberStates');
    this.sync(); Pages.render_meeting();
    if (document.getElementById('osc-modal-overlay')) this._renderMemberModal(teamId); // keep modal in sync while open
  },
  openMemberModal(id){ this._renderMemberModal(id); },
  _renderMemberModal(id){
    const t = this.find(id); if (!t) return;
    const rows = t.members.map(sn => {
      const st = (t.memberStates||{})[sn] || 'pending';
      const cls = st === 'complete' ? 'on-ok' : st === 'missing' ? 'on-missing' : '';
      return `<button class="loc-list-item ${cls}" onclick="MeetingOSC.cycleMember('${id}','${sn}')"><span class="loc-badge">${st.toUpperCase()}</span><span>${crewLabel(sn)}</span></button>`;
    }).join('');
    ModalOSC.open(`
      <div class="modal-header"><span class="modal-title">👥 ${escapeHtml(t.name)}</span><button class="modal-close" onclick="ModalOSC.close()">✕</button></div>
      <div class="modal-body"><div class="loc-list">${rows}</div></div>`);
  },
  removeMissing(teamId, sn){
    const t = this.find(teamId); if (!t) return;
    t.missing = (t.missing||[]).filter(m => m !== sn);
    if (t.memberStates) t.memberStates[sn] = 'pending';
    this.touch(teamId, 'missing', 'memberStates');
    this.sync(); Pages.render_meeting();
  },
  sync(){ NetOSC.send({ type:'OSC_TEAM_UPDATE', payload:{ changed:{kind:'meeting'}, fireTeams: STATE.fireTeams, protectionTeams: STATE.protectionTeams, meetingTeams: STATE.meetingTeams } }); },
};

};

/* ============================================================
   FireOSC — Fire Team A-D cards (full-page)
   ============================================================ */
const FireOSC = {
  getPressureColor(bar){
    if (bar===null||bar===undefined) return '#64748b';
    if (bar>200) return '#22c55e'; if (bar>100) return '#f97316'; return '#ef4444';
  },
  pressureSectionHtml(t){
    const pressures = t.memberPressures || {};
    const members = [{sn:String(t.leader),label:crewLabel(t.leader)},{sn:String(t.partner),label:crewLabel(t.partner)}];
    const rows = members.map(({sn,label}) => {
      const data = pressures[sn] || null;
      const bar = data ? data.bar : 300;
      const ts = data ? data.time : '—';
      const pct = Math.max(0,Math.min(100,(bar/300)*100)).toFixed(1);
      const color = this.getPressureColor(bar);
      return `<div class="pressure-member-block">
        <div class="pressure-member-header">
          <span class="pressure-member-lbl">${label}</span>
          <span class="pressure-val-badge" id="osc-press-val-${t.id}-${sn}" style="color:${color}">${bar}</span>
          <span class="pressure-unit">bar</span>
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--oe-gold);margin-left:6px">${ts}</span>
          <button class="ftc-log-btn" style="margin-left:auto" onclick="FireOSC.updatePressure(${t.id},'${sn}',document.getElementById('osc-press-slider-${t.id}-${sn}').value)">LOG</button>
        </div>
        <input type="range" class="pressure-slider" id="osc-press-slider-${t.id}-${sn}" min="0" max="300" step="5" value="${bar}"
          style="--pslider-fill:${color};--pslider-pct:${pct}%" oninput="FireOSC.liveUpdatePressure(${t.id},'${sn}',this.value)">
      </div>`;
    }).join('');
    return `<div class="ftc-pressure-section"><div class="ftc-pressure-title">🫁 BA BOTTLE PRESSURE</div>${rows}</div>`;
  },
  cardHtml(t){
    const statusColors = { complete:'var(--status-ok)', o2:'#E67E22', active:'#2980B9', missing:'var(--status-danger)' };
    const shortName = 'FT' + String.fromCharCode(64 + t.id);
    const memberBtn = (sn,label) => {
      const st = (t.memberStates||{})[sn] || 'missing';
      return `<button class="ftc-member-btn ${st==='complete'?'on-ok':'on-missing'}" onclick="FireOSC.toggleMember(${t.id},'${sn}')">${label}</button>`;
    };
    return `
    <div class="ftc" id="osc-ftc-${t.id}" style="border-left-color:${statusColors[t.status]||'var(--oe-navy-border)'}">
      <div class="ftc-member-grid">
        ${memberBtn(t.leader, crewLabel(t.leader))}
        ${memberBtn(t.partner, crewLabel(t.partner))}
        ${memberBtn(t.dresser, crewLabel(t.dresser))}
      </div>
      ${this.pressureSectionHtml(t)}
      <div class="ftc-status-row">
        <button class="ftc-btn ${t.status==='complete'?'act-standby':''}" onclick="FireOSC.setStatus(${t.id},'complete')">COMPLETE</button>
        <button class="ftc-btn ${t.status==='o2'?'act-o2':''}" onclick="FireOSC.setStatus(${t.id},'o2')">O₂</button>
        <button class="ftc-btn ${t.status==='active'?'act-active':''}" onclick="FireOSC.setStatus(${t.id},'active')">ACTIVE</button>
        <button class="ftc-btn ${t.status==='missing'?'act-casualty':''}" onclick="FireOSC.setStatus(${t.id},'missing')">MISS</button>
      </div>
      <div class="sit-row">
        <input class="ftc-loc" id="osc-ft-loc-${t.id}" placeholder="📍 Location..." value="${escapeHtml(t.location||'')}" onchange="FireOSC.updateLoc(${t.id},this.value)">
        <button class="ftc-log-btn ftc-loc-picker" onclick="LocationOSC.open('${shortName}',document.getElementById('osc-ft-loc-${t.id}').value,v=>{FireOSC.updateLoc(${t.id},v);const el=document.getElementById('osc-ft-loc-${t.id}');if(el)el.value=v;})" title="Sélectionner un local / plan"><span class="ico">📍</span><span>Select location</span></button>
      </div>
      <div class="ftc-o2 ${t.status==='o2'?'show':''}"><div class="ftc-o2-time safe" id="osc-ftc-o2-time-${t.id}">00:00</div><div style="font-size:9px;color:var(--oe-cream-dim)">O₂ CHRONO</div></div>
      <div class="sit-row"><textarea class="ftc-note" id="osc-ft-note-${t.id}" placeholder="Note..."></textarea></div>
      <div style="display:flex;gap:6px">
        <button class="ftc-log-btn" style="flex:1" onclick="FireOSC.logNote(${t.id})">LOG</button>
        <button class="ftc-log-btn" style="flex:1;background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.4);color:#2ecc71" onclick="FireOSC.logAtMP(${t.id})">AT MP</button>
        <button class="ftc-log-btn" style="flex:1;background:rgba(0,180,216,0.2);border-color:rgba(0,180,216,0.4);color:#00b4d8" onclick="PredefOSC.open('${escapeHtml(t.name)}',(text,time)=>FireOSC.logPredef(${t.id},text,time))">⚡ Actions</button>
      </div>
      <div class="ftc-hist">${(t.notes||[]).map(n => `<div class="ftc-hi"><span class="ftc-ht">${n.time}</span>${escapeHtml(n.text)}</div>`).join('')}</div>
    </div>`;
  },
  touch(id, ...fields){ touchFields(STATE.touched.fireTeams, id, fields); },
  setStatus(id, status){
    const t = STATE.fireTeams.find(x=>x.id===id); if (!t) return;
    const prev = t.status; t.status = status;
    t.memberStates = t.memberStates || {};
    this.touch(id, 'status', 'memberStates', 'o2Start');
    if (status === 'complete') [t.leader,t.partner,t.dresser].filter(Boolean).forEach(sn => t.memberStates[sn]='complete');
    if (status === 'o2' && prev !== 'o2') { t.o2Start = Date.now(); this.startO2(id); }
    else if (status !== 'o2') this.stopO2(id);
    this.sync(id); Pages.renderActive();
  },
  toggleMember(id, sn){
    const t = STATE.fireTeams.find(x=>x.id===id); if (!t) return;
    t.memberStates = t.memberStates || {};
    t.memberStates[sn] = t.memberStates[sn]==='complete' ? 'missing' : 'complete';
    const states = Object.values(t.memberStates);
    if (states.some(s=>s==='missing')) t.status='missing'; else if (t.status==='missing') t.status='complete';
    this.touch(id, 'status', 'memberStates');
    this.sync(id); Pages.renderActive();
  },
  updateLoc(id, val){ const t=STATE.fireTeams.find(x=>x.id===id); if(!t) return; t.location=val; this.touch(id,'location'); this.sync(id); },
  logNote(id){
    const t=STATE.fireTeams.find(x=>x.id===id); const input=document.getElementById('osc-ft-note-'+id);
    if (!t||!input||!input.value.trim()) return;
    t.notes.unshift({ time: nowTime(), text: input.value.trim() });
    t.notes = t.notes.slice(0, 50); // bounded — rides every STATE_SYNC snapshot
    this.touch(id, 'notes');
    input.value=''; this.sync(id); Pages.renderActive();
  },
  logAtMP(id){
    const t = STATE.fireTeams.find(x=>x.id===id); if (!t) return;
    t.notes.unshift({ time: nowTime(), text: 'At the meeting point' });
    t.notes = t.notes.slice(0, 50);
    this.touch(id, 'notes');
    this.sync(id); Pages.renderActive();
  },
  logPredef(id, text, time){
    const t = STATE.fireTeams.find(x=>x.id===id); if (!t) return;
    t.notes.unshift({ time: time || nowTime(), text });
    t.notes = t.notes.slice(0, 50);
    this.touch(id, 'notes');
    this.sync(id); Pages.renderActive();
  },
  liveUpdatePressure(id, sn, raw){
    const bar = parseInt(raw,10); const color=this.getPressureColor(bar);
    const val=document.getElementById(`osc-press-val-${id}-${sn}`); if (val){ val.textContent=bar; val.style.color=color; }
    const slider=document.getElementById(`osc-press-slider-${id}-${sn}`);
    if (slider) slider.style.setProperty('--pslider-fill',color), slider.style.setProperty('--pslider-pct',Math.max(0,Math.min(100,(bar/300)*100))+'%');
  },
  updatePressure(id, sn, raw){
    const t=STATE.fireTeams.find(x=>x.id===id); if(!t) return;
    t.memberPressures = t.memberPressures || {};
    t.memberPressures[sn] = { bar: parseInt(raw,10), time: nowTime() };
    this.touch(id, 'memberPressures');
    this.sync(id); Pages.renderActive();
  },
  startO2(id){
    if (STATE.o2Intervals[id]) return;
    const t = STATE.fireTeams.find(x=>x.id===id); if (!t) return;
    this.updateO2Chrono(t);
    STATE.o2Intervals[id] = setInterval(() => this.updateO2Chrono(t), 1000);
  },
  updateO2Chrono(t){
    if (!t.o2Start) return;
    const elapsed = Math.max(0, Math.floor((Date.now()-t.o2Start)/1000));
    const m = String(Math.floor(elapsed/60)).padStart(2,'0'), s = String(elapsed%60).padStart(2,'0');
    const pct = t.o2Duration ? (elapsed/(t.o2Duration*60))*100 : 0;
    const el = document.getElementById('osc-ftc-o2-time-'+t.id);
    if (el){ el.textContent = `${m}:${s}`; el.className = 'ftc-o2-time ' + (pct>90?'danger':pct>70?'caution':'safe'); }
  },
  stopO2(id){
    if (STATE.o2Intervals[id]) { clearInterval(STATE.o2Intervals[id]); delete STATE.o2Intervals[id]; }
    const el = document.getElementById('osc-ftc-o2-time-'+id); if (el){ el.textContent='00:00'; el.className='ftc-o2-time safe'; }
  },
  reconcileO2(t){ if (t.status==='o2' && t.o2Start) this.startO2(t.id); else this.stopO2(t.id); },
  sync(changedId){ NetOSC.send({ type:'OSC_TEAM_UPDATE', payload:{ changed:{kind:'fire',teamId:changedId}, fireTeams: STATE.fireTeams, protectionTeams: STATE.protectionTeams } }); },
};

/* ============================================================
   MedicalOSC — victims (simplified, no body-diagram SVG)
   ============================================================ */
const MedicalOSC = {
  TRIAGE: ['T1','T2','T3','T4'],
  INJURIES: ['Laceration','Fracture','Burns','Intoxication','Near-Drowning','Cardiac Arrest','Head Trauma','Hypothermia','Spinal Injury','Chest Injury','Abdominal Injury','Eye Injury'],
  MEANS: ['AED','Oxygen','Stretcher','Cervical Collar','Backboard','Medical Kit','TMAS Contact','MEDEVAC'],
  getIdentityCatalog(type){
    if (type === 'CREW') {
      return Array.isArray(window.OE_CREW?.crew) ? window.OE_CREW.crew : [];
    }
    const paxList = Array.isArray(window.OE_CREW?.pax) ? window.OE_CREW.pax : [];
    if (paxList.length) return paxList;
    return Array.isArray(window.OE_CREW?.crew) ? window.OE_CREW.crew : [];
  },
  getIdentityFieldLabel(type){ return type === 'CREW' ? 'SAFETY NUMBER' : 'CABIN NUMBER'; },
  getIdentityPlaceholder(type){ return type === 'CREW' ? 'Safety number...' : 'Cabin number...'; },
  getIdentityOptionsHtml(type, selectedKey){
    const list = this.getIdentityCatalog(type);
    const emptyOption = `<option value="" ${selectedKey ? '' : 'selected'}>— ${type === 'CREW' ? 'SELECT FROM CREW LIST' : 'SELECT FROM PAX LIST'} —</option>`;
    const options = list.map(entry => {
      const key = type === 'CREW' ? String(entry?.safetyNumber || '') : String(entry?.cabin || '');
      if (!key) return '';
      const name = String(entry?.name || '').trim();
      const extra = type === 'CREW'
        ? [entry?.rank, entry?.cabin].filter(Boolean).join(' • ')
        : [entry?.cabin, entry?.nationality].filter(Boolean).join(' • ');
      const label = [key, name, extra].filter(Boolean).join(' — ');
      const selected = String(selectedKey || '') === String(key) ? 'selected' : '';
      return `<option value="${escapeHtml(key)}" ${selected}>${escapeHtml(label)}</option>`;
    }).filter(Boolean).join('');

  toggleVictimType(id){

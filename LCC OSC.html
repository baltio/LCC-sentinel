/* ============================================================
   SpacesData — charge les zones annotées (Zone Annotator) avec
   fallback robuste vers OE_SPACES embarqué
   ============================================================ */
const SpacesData = {
  DEFAULT_ASSET_PATH: 'assets/OE_SPACES_annotated_2026-04-15.json',
  sourceLabel: 'Source zones: OE_SPACES embarqué',
  _spaces: null,

  _normalizeDeck(deck) {
    const d = String(deck || '').trim();
    if (!d) return '';
    if (/^(UNDER|under|DKDB)$/i.test(d)) return 'under';
    const m = d.match(/^DK\s*0?(\d{1,2})$/i);
    if (m) return 'DK' + m[1].padStart(2, '0');
    return d;
  },

  _normalizePoly(polySrc) {
    if (!Array.isArray(polySrc) || !polySrc.length) return [];
    if (typeof polySrc[0] === 'number') {
      const pts = [];
      for (let i = 0; i + 1 < polySrc.length; i += 2) {
        const x = Number(polySrc[i]);
        const y = Number(polySrc[i + 1]);
        if (Number.isFinite(x) && Number.isFinite(y)) pts.push([x, y]);
      }
      return pts;
    }
    return polySrc
      .map(p => Array.isArray(p) && p.length >= 2 ? [Number(p[0]), Number(p[1])] : null)
      .filter(p => p && Number.isFinite(p[0]) && Number.isFinite(p[1]));
  },

  _toSpaces(rawList) {
    if (!Array.isArray(rawList)) return [];
    const out = [];
    rawList.forEach((raw, idx) => {
      if (!raw || typeof raw !== 'object') return;
      const name = String(raw.name || '').trim();
      const deck = this._normalizeDeck(raw.deck);
      const mvz = Number(raw.mvz);
      if (!name || !deck || !Number.isFinite(mvz)) return;
      const polySrc = Array.isArray(raw.poly) ? raw.poly : (Array.isArray(raw.pts) ? raw.pts : []);
      const poly = this._normalizePoly(polySrc);
      out.push({
        id: String(raw.id || raw.zone || `zone-${idx + 1}`),
        zone: String(raw.zone || raw.id || `zone-${idx + 1}`),
        name,
        deck,
        mvz,
        type: String(raw.type || 'technical'),
        danger: String(raw.danger || 'low'),
        poly,
      });
    });
    return out;
  },

  _getBuiltInSpaces() {
    return this._toSpaces(Array.isArray(window.OE_SPACES) ? window.OE_SPACES : []);
  },

  _stripJsonComments(text) {
    return String(text || '').replace(/^\s*\/\/.*$/gm, '').trim();
  },

  async init() {
    let spaces = [];
    try {
      const res = await fetch(this.DEFAULT_ASSET_PATH, { cache: 'no-store' });
      if (res.ok) {
        const raw = JSON.parse(this._stripJsonComments(await res.text()));
        const list = Array.isArray(raw) ? raw : (Array.isArray(raw?.zones) ? raw.zones : []);
        spaces = this._toSpaces(list);
        if (spaces.length) {
          this._spaces = spaces;
          this.sourceLabel = `Source zones: ${this.DEFAULT_ASSET_PATH} (${spaces.length} zones)`;
          return;
        }
      }
    } catch (e) {}
    spaces = this._getBuiltInSpaces();
    this._spaces = spaces;
    this.sourceLabel = `Source zones: OE_SPACES embarqué (${spaces.length} zones)`;
  },

  getSpaces() {
    if (!Array.isArray(this._spaces)) this._spaces = this._getBuiltInSpaces();
    return this._spaces;
  },

  describeSource() {
    return this.sourceLabel;
  },
};

/* ============================================================
   PlansOSC — single-panel deck plan viewer + tactical control
   with Zone Annotator polygons for direct zone picking.
   ============================================================ */
const PlansOSC = {
  ICONS: [
    { id:'FTA', emoji:'🔴', label:'FTA' }, { id:'FTB', emoji:'🟠', label:'FTB' },
    { id:'FTC', emoji:'🟡', label:'FTC' }, { id:'FTD', emoji:'🟢', label:'FTD' },
    { id:'PT1', emoji:'🔵', label:'PT1' }, { id:'PT2', emoji:'🟣', label:'PT2' },
    { id:'PT3', emoji:'⚪', label:'PT3' }, { id:'PT4', emoji:'⚫', label:'PT4' },
    { id:'CASUALTY', emoji:'🚑', label:'Casualty' }, { id:'MEDICAL', emoji:'⚕️', label:'Medical' },
    { id:'MEETING', emoji:'👥', label:'Meeting' }, { id:'OSC', emoji:'🎖️', label:'OSC' },
  ],
  selectedZoneId: '',
  selectedZone: null,
  placingId: null,
  img: null,
  view: { zoom: 1, panX: 0, panY: 0 },
  activePointers: new Map(),
  pinchStartDist: 0,
  pinchStartZoom: 1,
  MAX_ZOOM: 30,

  _normalizeDeck(deck) {
    return SpacesData._normalizeDeck(deck);
  },

  getDeckSpaces(deck) {
    const norm = this._normalizeDeck(deck);
    return SpacesData.getSpaces().filter(s => this._normalizeDeck(s.deck) === norm && Array.isArray(s.poly) && s.poly.length >= 3);
  },

  zoneKey(space) {
    if (!space) return '';
    return String(space.zone || space.id || `${space.deck}:${space.name}`);
  },

  _normalizeDeckValue(deck) {
    const raw = String(deck || '').trim().toUpperCase();
    if (!raw) return '';
    const compact = raw.replace(/[^A-Z0-9]+/g, '');
    if (compact.startsWith('DK')) return compact;
    const m = /DECK\s*0?(\d{1,2})/i.exec(raw);
    if (m) return `DK${String(Number(m[1])).padStart(2, '0')}`;
    return compact;
  },

  _normalizeMvzValue(mvz) {
    const raw = String(mvz || '').trim();
    if (!raw) return '';
    const m = raw.match(/(\d+)/);
    return m ? String(Number(m[1])) : raw.toUpperCase();
  },

  _getZoneOverlayState(space) {
    const key = this.zoneKey(space);
    const z = STATE.plans.zoneStates[key] || {};
    if (z.evacuationStatus === 'in-progress' || z.evacuationStatus === 'evacuated') return z.evacuationStatus;
    if (Array.isArray(STATE.evac?.selected)) {
      const match = STATE.evac.selected.find(entry => this._normalizeDeckValue(entry.deck) === this._normalizeDeckValue(space.deck) && this._normalizeMvzValue(entry.mvz) === this._normalizeMvzValue(space.mvz));
      if (match) return match.status === 'evacuated' ? 'evacuated' : 'in-progress';
    }
    if (z.evacuated) return 'checked';
    return null;
  },

  _tokenForIconId(iconId) {
    if (/^FT[ABCD]$/.test(iconId || '')) return { kind: 'fire', text: String(iconId || '').slice(-1) };
    if (/^PT[1-4]$/.test(iconId || '')) return { kind: 'protection', text: String(iconId || '').slice(-1) };
    return null;
  },

  iconSwatchHtml(icon) {
    const tok = this._tokenForIconId(icon?.id || '');
    if (tok) return `<span class="plan-token ${tok.kind}">${tok.text}</span>`;
    return `<span>${icon?.emoji || '📍'}</span>`;
  },

  _drawZoneOverlayExtra(ctx, pts, overlayState, novec, zoom) {
    if (!pts || pts.length < 3) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
    ctx.closePath();
    ctx.clip();
    let bx0 = pts[0].x, by0 = pts[0].y, bx1 = pts[0].x, by1 = pts[0].y;
    pts.forEach(p => { bx0 = Math.min(bx0, p.x); by0 = Math.min(by0, p.y); bx1 = Math.max(bx1, p.x); by1 = Math.max(by1, p.y); });
    if (overlayState === 'checked') {
      const crossStep = Math.max(8, 16 / (zoom || 1));
      ctx.strokeStyle = 'rgba(14, 80, 140, 0.95)';
      ctx.lineWidth = Math.max(0.6, 0.8 / (zoom || 1));
      for (let cx = bx0 + crossStep / 2; cx < bx1; cx += crossStep) {
        for (let cy = by0 + crossStep / 2; cy < by1; cy += crossStep) {
          ctx.beginPath();
          ctx.moveTo(cx - 2.2, cy - 2.2); ctx.lineTo(cx + 2.2, cy + 2.2);
          ctx.moveTo(cx - 2.2, cy + 2.2); ctx.lineTo(cx + 2.2, cy - 2.2);
          ctx.stroke();
        }
      }
    } else if (overlayState === 'in-progress' || overlayState === 'evacuated') {
      const outlineColor = overlayState === 'in-progress' ? 'rgba(216,60,46,0.95)' : 'rgba(34,197,94,0.95)';
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = Math.max(1.6, 2.4 / (zoom || 1));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
      ctx.closePath();
      ctx.stroke();
    }
    if (novec) {
      const step = Math.max(5, 12 / (zoom || 1));
      const r = Math.max(1, 2 / (zoom || 1));
      ctx.fillStyle = 'rgba(180,100,255,0.70)';
      for (let px = bx0 + step / 2; px < bx1; px += step) {
        for (let py = by0 + step / 2; py < by1; py += step) {
          ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    ctx.restore();
  },

  _drawTacticalMarker(ctx, icon, x, y) {
    const tok = this._tokenForIconId(icon?.id || '');
    if (!tok) {
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(icon ? icon.emoji : '📍', x, y);
      return;
    }
    ctx.beginPath();
    ctx.arc(x, y, 13, 0, Math.PI * 2);
    if (tok.kind === 'fire') {
      ctx.fillStyle = '#cc2f2f';
      ctx.strokeStyle = '#ffd0d0';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
    } else {
      ctx.fillStyle = '#ffd24a';
      ctx.strokeStyle = '#8c6a00';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#192534';
    }
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tok.text, x, y + 0.5);
  },

  _syncTeamLocationFromMarker(iconId, src){
    if (!iconId || !src) return;
    let teamId = null;
    let kind = null;
    const ft = String(iconId).match(/^FT([ABCD])$/);
    if (ft) {
      kind = 'fire';
      teamId = { A:1, B:2, C:3, D:4 }[ft[1]] || null;
    }
    const pt = String(iconId).match(/^PT([1-4])$/);
    if (pt) {
      kind = 'protection';
      teamId = Number(pt[1]);
    }
    if (!kind || !teamId) return;
    const spaces = this.getDeckSpaces(STATE.plans.currentDeck);
    const hit = spaces.find(s => this._pointInPoly(src.x, src.y, s.poly));
    const value = hit && hit.name ? hit.name : `${STATE.plans.currentDeck} (plan)`;
    if (kind === 'fire') FireOSC.updateLoc(teamId, value);
    else ProtectionOSC.updateLoc(teamId, value);
  },

  _statusStyle(status, isSelected) {
    const map = {
      ras: ['rgba(180,180,180,0.18)', 'rgba(210,210,210,0.65)'],
      smoke: ['rgba(240,145,58,0.22)', 'rgba(240,145,58,0.8)'],
      fire: ['rgba(224,64,64,0.24)', 'rgba(224,64,64,0.9)'],
      water: ['rgba(68,138,255,0.22)', 'rgba(68,138,255,0.85)'],
      green: ['rgba(58,191,119,0.22)', 'rgba(58,191,119,0.9)'],
      violet: ['rgba(154,90,214,0.22)', 'rgba(154,90,214,0.9)'],
    };
    const pair = map[status] || ['rgba(112,130,150,0.12)', 'rgba(112,130,150,0.6)'];
    return { fill: pair[0], stroke: isSelected ? '#ffffff' : pair[1], lineWidth: isSelected ? 2.6 : 1.4 };
  },

  _pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  },

  _canvasToSource(cx, cy) {
    if (!this._lastDraw) return null;
    const { x, y, w, h } = this._lastDraw;
    if (cx < x || cy < y || cx > x + w || cy > y + h) return null;
    const sx = ((cx - x) / w) * this.img.naturalWidth;
    const sy = ((cy - y) / h) * this.img.naturalHeight;
    return { x: sx, y: sy };
  },

  _sourceToCanvas(sx, sy) {
    if (!this._lastDraw || !this.img || !this.img.naturalWidth || !this.img.naturalHeight) return null;
    const { x, y, w, h } = this._lastDraw;
    const cx = x + (sx / this.img.naturalWidth) * w;
    const cy = y + (sy / this.img.naturalHeight) * h;
    return { x: cx, y: cy };
  },

  _fitToDeck(deck) {
    const spaces = this.getDeckSpaces(deck);
    if (!spaces.length || !this.img || !this.img.naturalWidth) {
      this.view = { zoom: 1, panX: 0, panY: 0 };
      return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    spaces.forEach(s => (s.poly || []).forEach(pt => {
      if (!Array.isArray(pt) || pt.length < 2) return;
      const x = Number(pt[0]); const y = Number(pt[1]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }));
    if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) {
      this.view = { zoom: 1, panX: 0, panY: 0 };
      return;
    }
    const viewer = document.getElementById('plan-viewer');
    const canvas = document.getElementById('plan-canvas');
    if (!viewer || !canvas) return;
    const cw = canvas.width || viewer.clientWidth;
    const ch = canvas.height || viewer.clientHeight;
    const baseFit = Math.min(cw / this.img.naturalWidth, ch / this.img.naturalHeight);
    const pad = 70;
    const boxW = Math.max(30, maxX - minX);
    const boxH = Math.max(30, maxY - minY);
    const targetScale = Math.min((cw - pad) / boxW, (ch - pad) / boxH);
    const zoom = Math.max(1, Math.min(this.MAX_ZOOM, targetScale / baseFit));
    const s = baseFit * zoom;
    const zoneCx = (minX + maxX) / 2;
    const zoneCy = (minY + maxY) / 2;
    const imgCx = this.img.naturalWidth / 2;
    const imgCy = this.img.naturalHeight / 2;
    const panX = (cw / 2) - (zoneCx - imgCx) * s - (cw / 2);
    const panY = (ch / 2) - (zoneCy - imgCy) * s - (ch / 2);
    this.view = { zoom, panX, panY };
  },

  currentZoneStatus(){ const z = STATE.plans.zoneStates[this.selectedZoneId]; return z ? z.status : null; },
  currentZoneFlag(key){ const z = STATE.plans.zoneStates[this.selectedZoneId]; return z ? !!z[key] : false; },
  getZoneState(){
    if (!this.selectedZoneId) return null;
    STATE.plans.zoneStates[this.selectedZoneId] = STATE.plans.zoneStates[this.selectedZoneId] || { status:null, evacuated:false, novec:false, history:[] };
    return STATE.plans.zoneStates[this.selectedZoneId];
  },
  statusButtonsHtml(){
    return ['ras','smoke','fire','water','green','violet'].map(s =>
      `<button class="plan-status-btn status-${s} ${this.currentZoneStatus()===s?'active':''}" onclick="PlansOSC.setStatus('${s}')">${s.toUpperCase()}</button>`).join('');
  },
  flagsHtml(){
    return `<label class="plan-check"><input type="checkbox" ${this.currentZoneFlag('evacuated')?'checked':''} onchange="PlansOSC.setFlag('evacuated',this.checked)"> Checked</label>
      <label class="plan-check"><input type="checkbox" ${this.currentZoneFlag('novec')?'checked':''} onchange="PlansOSC.setFlag('novec',this.checked)"> Under NOVEC</label>`;
  },
  historyHtml(){
    const z = STATE.plans.zoneStates[this.selectedZoneId];
    if (!z || !z.history || !z.history.length) return '<span>—</span>';
    return z.history.slice(0,15).map(h => `<div>${h.time} — ${escapeHtml(h.text)}</div>`).join('');
  },
  appendHistory(text){
    const z = this.getZoneState(); if (!z) return;
    z.history = [{ time: nowTime(), text }, ...(z.history||[])].slice(0,20);
  },
  refreshTacticalPanel(){
    const grid = document.getElementById('plan-status-grid'); if (grid) grid.innerHTML = this.statusButtonsHtml();
    const flags = document.getElementById('plan-flags'); if (flags) flags.innerHTML = this.flagsHtml();
    const hist = document.getElementById('plan-zone-history'); if (hist) hist.innerHTML = this.historyHtml();
  },
  setSelectedZoneId(val){
    this.selectedZoneId = (val || '').trim();
    this.selectedZone = null;
    this.refreshZoneChip(); this.refreshTacticalPanel();
  },
  setStatus(status){
    if (!this.selectedZoneId) return;
    const z = this.getZoneState(); z.status = status;
    this.appendHistory('Status → ' + status.toUpperCase());
    this.refreshTacticalPanel(); this.redraw();
  },
  setFlag(key, val){
    if (!this.selectedZoneId) return;
    const z = this.getZoneState(); z[key] = val;
    this.appendHistory((key==='evacuated'?'Evacuated':'NOVEC') + ' → ' + (val?'ON':'OFF'));
    this.refreshTacticalPanel();
  },
  setDeck(deck, btn){
    STATE.plans.currentDeck = this._normalizeDeck(deck);
    this.selectedZoneId = '';
    this.selectedZone = null;
    document.querySelectorAll('#page-plans .plan-deck-tabs .deck-btn').forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');
    this._fitToDeck(STATE.plans.currentDeck);
    this.redraw();
    this.refreshZoneChip();
    this.refreshTacticalPanel();
  },
  startPlacing(iconId){
    this.placingId = this.placingId === iconId ? null : iconId;
    document.querySelectorAll('#plan-icon-palette .plan-icon-item').forEach(el => el.classList.remove('placing'));
    if (this.placingId) {
      const idx = this.ICONS.findIndex(i => i.id === iconId);
      const el = document.querySelectorAll('#plan-icon-palette .plan-icon-item')[idx];
      if (el) el.classList.add('placing');
    }
  },
  clearDeckMarkers(){
    const current = this._normalizeDeck(STATE.plans.currentDeck);
    STATE.plans.markers = STATE.plans.markers.filter(m => this._normalizeDeck(m.deck) !== current);
    this.redraw();
    NetOSC.sendStateSyncNow();
  },

  _isSinglePlacementIcon(iconId){
    return /^FT[ABCD]$/.test(iconId || '') || /^PT[1-4]$/.test(iconId || '');
  },

  _upsertMarker(iconId, x, y, sx, sy){
    const deck = this._normalizeDeck(STATE.plans.currentDeck);
    if (this._isSinglePlacementIcon(iconId)) {
      const existing = STATE.plans.markers.findIndex(m => this._normalizeDeck(m.deck) === deck && m.iconId === iconId);
      if (existing >= 0) {
        const marker = STATE.plans.markers[existing];
        marker.x = x; marker.y = y; marker.sx = sx; marker.sy = sy;
        return marker;
      }
    }
    const marker = { id:'m'+Date.now(), iconId, deck:STATE.plans.currentDeck, x, y, sx, sy };
    STATE.plans.markers.push(marker);
    return marker;
  },

  /* ── canvas ── */
  initCanvas(){
    const viewer = document.getElementById('plan-viewer');
    const canvas = document.getElementById('plan-canvas');
    if (!viewer || !canvas) return;
    this._resize();
    // BUGFIX: this used to add a fresh `window.addEventListener('resize', ...)` closure
    // on every call — and initCanvas() re-runs every time the Plans page is rebuilt
    // (each navigation to the page, formerly also every network update). None of those
    // listeners were ever removed, and each one closed over that call's now-detached
    // #plan-canvas/#plan-viewer elements, pinning them in memory forever. Over a multi-
    // hour session with the Plans page revisited repeatedly this leaked without bound
    // and is the most likely cause of the tablet app bogging down/crashing in the field.
    // Bind the resize listener exactly once for the page's lifetime; _resize() below
    // always re-queries the *current* canvas/viewer by id, so a single bound listener
    // keeps working correctly across any number of page rebuilds.
    if (!this._resizeBound) {
      window.addEventListener('resize', () => this._resize());
      this._resizeBound = true;
    }
    if (!this.img) {
      this.img = new Image();
      this.img.onload = () => { this._fitToDeck(STATE.plans.currentDeck); this.redraw(); };
      this.img.onerror = () => { const chip = document.getElementById('plan-zone-chip'); if (chip) chip.textContent = 'Plan image indisponible'; };
      this.img.src = 'assets/img/plans/GaLCC_page_01.png';
    } else {
      this._fitToDeck(STATE.plans.currentDeck);
      this.redraw();
    }
    this.bindEvents(canvas);
  },
  _resize(){
    const viewer = document.getElementById('plan-viewer');
    const canvas = document.getElementById('plan-canvas');
    if (!viewer || !canvas) return;
    canvas.width = viewer.clientWidth; canvas.height = viewer.clientHeight;
    this.redraw();
  },
  resetView(){ this._fitToDeck(STATE.plans.currentDeck); this.redraw(); },
  zoom(factor){
    this.view.zoom = Math.max(0.3, Math.min(this.MAX_ZOOM, this.view.zoom * factor));
    this.redraw();
  },
  redraw(){
    const canvas = document.getElementById('plan-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0c1620'; ctx.fillRect(0,0,canvas.width,canvas.height);
    if (this.img && this.img.complete && this.img.naturalWidth) {
      const scaleFit = Math.min(canvas.width / this.img.naturalWidth, canvas.height / this.img.naturalHeight);
      const s = scaleFit * this.view.zoom;
      const w = this.img.naturalWidth * s, h = this.img.naturalHeight * s;
      const x = (canvas.width - w) / 2 + this.view.panX;
      const y = (canvas.height - h) / 2 + this.view.panY;
      ctx.drawImage(this.img, x, y, w, h);
      this._lastDraw = { x, y, w, h };
    }
    // Draw annotated zones for the current deck (Zone Annotator source).
    const deckSpaces = this.getDeckSpaces(STATE.plans.currentDeck);
    deckSpaces.forEach(space => {
      const poly = Array.isArray(space.poly) ? space.poly : [];
      if (poly.length < 3) return;
      const key = this.zoneKey(space);
      const st = STATE.plans.zoneStates[key] || {};
      const sty = this._statusStyle(st.status, key === this.selectedZoneId);
      const pts = [];
      ctx.beginPath();
      poly.forEach((pt, idx) => {
        const p = this._sourceToCanvas(Number(pt[0]), Number(pt[1]));
        if (!p) return;
        pts.push(p);
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = sty.fill;
      ctx.strokeStyle = sty.stroke;
      ctx.lineWidth = sty.lineWidth;
      ctx.fill();
      ctx.stroke();
      const overlayState = this._getZoneOverlayState(space);
      if (overlayState || st.novec) this._drawZoneOverlayExtra(ctx, pts, overlayState, !!st.novec, this.view.zoom || 1);
    });

    // Tactical icon markers for the current deck.
    const markers = STATE.plans.markers.filter(m => this._normalizeDeck(m.deck) === this._normalizeDeck(STATE.plans.currentDeck));
    markers.forEach(m => {
      const icon = this.ICONS.find(i => i.id === m.iconId);
      let drawX = Number(m.x), drawY = Number(m.y);
      if (Number.isFinite(Number(m.sx)) && Number.isFinite(Number(m.sy))) {
        const pt = this._sourceToCanvas(Number(m.sx), Number(m.sy));
        if (pt) { drawX = pt.x; drawY = pt.y; }
      }
      this._drawTacticalMarker(ctx, icon, drawX, drawY);
    });
  },
  bindEvents(canvas){
    if (canvas._bound) return; canvas._bound = true;
    let dragging = false, lastX = 0, lastY = 0, moved = false;

    const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      this.activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (this.activePointers.size === 1) { dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY; }
      else if (this.activePointers.size === 2) {
        dragging = false;
        const pts = [...this.activePointers.values()];
        this.pinchStartDist = dist(pts[0], pts[1]);
        this.pinchStartZoom = this.view.zoom;
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!this.activePointers.has(e.pointerId)) return;
      this.activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (this.activePointers.size === 2) {
        const pts = [...this.activePointers.values()];
        const d = dist(pts[0], pts[1]);
        if (this.pinchStartDist > 0) this.view.zoom = Math.max(0.3, Math.min(this.MAX_ZOOM, this.pinchStartZoom * (d / this.pinchStartDist)));
        this.redraw();
        return;
      }
      if (dragging) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        this.view.panX += dx; this.view.panY += dy;
        lastX = e.clientX; lastY = e.clientY;
        this.redraw();
      }
    });
    const endPointer = (e) => {
      this.activePointers.delete(e.pointerId);
      if (this.activePointers.size < 2) this.pinchStartDist = 0;
      if (this.activePointers.size === 0 && dragging && !moved) this.handleTap(e);
      dragging = false;
    };
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoom(e.deltaY < 0 ? 1.2 : 0.84);
    }, { passive:false });
  },
  handleTap(e){
    const canvas = document.getElementById('plan-canvas');
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const src = this._canvasToSource(x, y);
    if (this.placingId) {
      if (!src) return;
      this._upsertMarker(this.placingId, x, y, src.x, src.y);
      this._syncTeamLocationFromMarker(this.placingId, src);
      NetOSC.sendStateSyncNow();
      this.placingId = null;
      document.querySelectorAll('#plan-icon-palette .plan-icon-item').forEach(el => el.classList.remove('placing'));
      this.redraw();
      return;
    }
    if (!src) return;

    const spaces = this.getDeckSpaces(STATE.plans.currentDeck);
    const hit = spaces.find(s => this._pointInPoly(src.x, src.y, s.poly));
    if (!hit) return;
    this.selectedZone = hit;
    this.selectedZoneId = this.zoneKey(hit);
    const input = document.getElementById('plan-zone-input');
    if (input) input.value = this.selectedZoneId;
    this.refreshZoneChip();
    this.refreshTacticalPanel();
    this.redraw();
  },

  refreshZoneChip(){
    const el = document.getElementById('plan-zone-chip');
    if (!el) return;
    if (this.selectedZone) {
      el.textContent = `Zone: ${this.selectedZone.deck} MVZ${this.selectedZone.mvz} — ${this.selectedZone.name}`;
      return;
    }
    el.textContent = 'Zone: ' + (this.selectedZoneId || '—');
  },
};

/* ============================================================
   LocationOSC — team location picker: either pick from the ship's
   local-space list (window.OE_SPACES), or tap a position on the
   ship plan (opens by default on the fire's deck, or wherever the
   team is already placed).
   ============================================================ */
const LocationOSC = {
  _callback: null,
  _iconId: null,
  _tab: 'list',
  _deck: 'DK03',
  _filterDeck: 'ALL',
  _filterMvz: 'ALL',
  _search: '',
  img: null,
  _lastView: null,
  _draftSelection: null,
  _view: { zoom: 1, panX: 0, panY: 0 },
  _feedbackTimer: null,
  MAX_ZOOM: 30,
  _activePointers: new Map(),
  _pinchStartDist: 0,
  _pinchStartZoom: 1,

  _normalizeDeck(deck){
    return SpacesData._normalizeDeck(deck);
  },

  _deckSpaces(deck){
    const d = this._normalizeDeck(deck);
    return SpacesData.getSpaces().filter(s => this._normalizeDeck(s.deck) === d && Array.isArray(s.poly) && s.poly.length >= 3);
  },

  _pointInPoly(x, y, poly){
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  },

  _canvasToSource(x, y){
    const v = this._lastView;
    if (!v || !this.img || !this.img.naturalWidth || !this.img.naturalHeight) return null;
    if (x < v.ox || y < v.oy || x > v.ox + v.w || y > v.oy + v.h) return null;
    return {
      sx: ((x - v.ox) / v.w) * this.img.naturalWidth,
      sy: ((y - v.oy) / v.h) * this.img.naturalHeight,
    };
  },

  _sourceToCanvas(sx, sy){
    const v = this._lastView;
    if (!v || !this.img || !this.img.naturalWidth || !this.img.naturalHeight) return null;
    return {
      x: v.ox + (Number(sx) / this.img.naturalWidth) * v.w,
      y: v.oy + (Number(sy) / this.img.naturalHeight) * v.h,
    };
  },

  _findSpaceAtSource(deck, sx, sy){
    const spaces = this._deckSpaces(deck);
    return spaces.find(s => this._pointInPoly(sx, sy, s.poly)) || null;
  },

  _fitToDeck(deck){
    const spaces = this._deckSpaces(deck);
    const viewer = document.getElementById('loc-plan-viewer');
    const canvas = document.getElementById('loc-plan-canvas');
    if (!viewer || !canvas || !this.img || !this.img.naturalWidth || !spaces.length) {
      this._view = { zoom: 1, panX: 0, panY: 0 };
      return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    spaces.forEach(s => (s.poly || []).forEach(pt => {
      if (!Array.isArray(pt) || pt.length < 2) return;
      const px = Number(pt[0]);
      const py = Number(pt[1]);
      if (!Number.isFinite(px) || !Number.isFinite(py)) return;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
    }));
    if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) {
      this._view = { zoom: 1, panX: 0, panY: 0 };
      return;
    }
    const cw = canvas.width || viewer.clientWidth;
    const ch = canvas.height || viewer.clientHeight;
    const baseFit = Math.min(cw / this.img.naturalWidth, ch / this.img.naturalHeight);
    const pad = 70;
    const boxW = Math.max(30, maxX - minX);
    const boxH = Math.max(30, maxY - minY);
    const targetScale = Math.min((cw - pad) / boxW, (ch - pad) / boxH);
    const zoom = Math.max(1, Math.min(this.MAX_ZOOM, targetScale / baseFit));
    const s = baseFit * zoom;
    const zoneCx = (minX + maxX) / 2;
    const zoneCy = (minY + maxY) / 2;
    const imgCx = this.img.naturalWidth / 2;
    const imgCy = this.img.naturalHeight / 2;
    const panX = -(zoneCx - imgCx) * s;
    const panY = -(zoneCy - imgCy) * s;
    this._view = { zoom, panX, panY };
  },

  _showFeedback(text, kind){
    const el = document.getElementById('loc-plan-feedback');
    if (!el) return;
    el.textContent = text || '';
    el.className = `modal-plan-feedback ${kind === 'warn' ? 'warn' : 'ok'}`;
    clearTimeout(this._feedbackTimer);
    this._feedbackTimer = setTimeout(() => {
      const now = document.getElementById('loc-plan-feedback');
      if (now) { now.textContent = ''; now.className = 'modal-plan-feedback'; }
    }, 1500);
  },

  guessDeck(){
    const text = (STATE.fireSit.fields['fire-location'] || '') + ' ' + (STATE.fireSit.fields['fire-meeting'] || '');
    const m = text.match(/DK\s?0?(\d{1,2})/i);
    if (m) return 'DK' + m[1].padStart(2, '0');
    const marker = STATE.plans.markers.find(mk => mk.iconId === this._iconId);
    if (marker) return marker.deck;
    return STATE.plans.currentDeck || 'DK03';
  },
  open(iconId, currentValue, callback){
    this._iconId = iconId;
    this._callback = callback;
    this._tab = 'list';
    this._deck = this._normalizeDeck(this.guessDeck());
    this._filterDeck = this._deck || 'ALL';
    this._filterMvz = 'ALL';
    this._search = '';
    this._draftSelection = null;
    this._view = { zoom: 1, panX: 0, panY: 0 };
    clearTimeout(this._feedbackTimer);
    this._render();
  },
  setTab(tab){ this._tab = tab; this._render(); },
  _render(){
    ModalOSC.open(`
      <div class="modal-header"><span class="modal-title">📍 Localisation</span><button class="modal-close" onclick="ModalOSC.close()">✕</button></div>
      <div class="modal-tabs">
        <button class="modal-tab ${this._tab==='list'?'active':''}" onclick="LocationOSC.setTab('list')">LISTE DES LOCAUX</button>
        <button class="modal-tab ${this._tab==='plan'?'active':''}" onclick="LocationOSC.setTab('plan')">PLAN DU NAVIRE</button>
      </div>
      <div class="modal-body">${this._tab === 'list' ? this._listHtml() : this._planHtml()}</div>`);
    if (this._tab === 'plan') this._initPlanCanvas();
  },
  _decks(){
    const spaces = SpacesData.getSpaces();
    const order = ['DK11','DK10','DK09','DK08','DK07','DK06','DK05','DK04','DK03','DK02','DK01','under'];
    const set = Array.from(new Set(spaces.map(s => s.deck)));
    set.sort((a,b) => { const ai=order.indexOf(a), bi=order.indexOf(b); if(ai===-1&&bi===-1) return a.localeCompare(b); if(ai===-1) return 1; if(bi===-1) return -1; return ai-bi; });
    return set;
  },
  _decksForMvz(){
    const mvz = String(this._filterMvz || 'ALL');
    if (mvz === 'ALL') return this._decks();
    const spaces = SpacesData.getSpaces().filter(s => String(s.mvz) === mvz);
    const order = ['DK11','DK10','DK09','DK08','DK07','DK06','DK05','DK04','DK03','DK02','DK01','under'];
    const set = Array.from(new Set(spaces.map(s => s.deck)));
    set.sort((a,b) => { const ai=order.indexOf(a), bi=order.indexOf(b); if(ai===-1&&bi===-1) return a.localeCompare(b); if(ai===-1) return 1; if(bi===-1) return -1; return ai-bi; });
    return set;
  },
  _listHtml(){
    const spaces = SpacesData.getSpaces();
    const decks = this._decksForMvz();
    const effectiveDeck = (this._filterDeck !== 'ALL' && !decks.includes(this._filterDeck)) ? 'ALL' : this._filterDeck;
    const filtered = spaces.filter(s => {
      const deckOk = effectiveDeck === 'ALL' || s.deck === effectiveDeck;
      const mvzOk = this._filterMvz === 'ALL' || String(s.mvz) === this._filterMvz;
      const qOk = !this._search || (s.name || '').toLowerCase().includes(this._search.toLowerCase());
      return deckOk && mvzOk && qOk;
    }).slice(0, 200);
    const deckChips = ['ALL', ...decks].map(d => `<button class="modal-chip ${effectiveDeck===d?'active':''}" onclick="LocationOSC.setFilterDeck('${d}')">${d==='ALL'?'Tous ponts':(d==='under'?'UNDER':d)}</button>`).join('');
    const mvzChips = ['ALL','1','2','3','4'].map(m => `<button class="modal-chip ${this._filterMvz===m?'active':''}" onclick="LocationOSC.setFilterMvz('${m}')">${m==='ALL'?'Tous MVZ':'MVZ '+m}</button>`).join('');
    return `
      <input class="sit-input" placeholder="Rechercher un local..." value="${escapeHtml(this._search)}" oninput="LocationOSC.setSearch(this.value)">
      <div class="modal-filter-row" style="max-height:70px;overflow-y:auto">${deckChips}</div>
      <div class="modal-filter-row">${mvzChips}</div>
      <div class="loc-list">
        ${filtered.length ? filtered.map(s => `<button class="loc-list-item" onclick="LocationOSC.pickSpace(this.dataset.name)" data-name="${escapeHtml(s.name)}"><span class="loc-badge">${s.deck}${s.mvz?' Z'+s.mvz:''}</span><span>${escapeHtml(s.name)}</span></button>`).join('') : '<div style="color:var(--oe-cream-dim);font-size:12px;text-align:center;padding:20px">Aucun résultat</div>'}
      </div>`;
  },
  setFilterDeck(d){ this._filterDeck = d; this._render(); },
  setFilterMvz(m){
    this._filterMvz = m;
    const decks = this._decksForMvz();
    if (this._filterDeck !== 'ALL' && !decks.includes(this._filterDeck)) this._filterDeck = decks[0] || 'ALL';
    this._render();
  },
  setSearch(v){ this._search = v; this._render(); },
  pickSpace(name){
    if (this._callback) this._callback(name);
    ModalOSC.close();
  },
  _planHtml(){
    const decks = Pages.DECKS || ['DK11','DK10','DK09','DK08','DK07','DK06','DK05','DK04','DK03','DK02','DK01','under'];
    return `
      <select class="sit-input" onchange="LocationOSC.setDeck(this.value)" style="margin-bottom:6px">
        ${decks.map(d => `<option value="${d}" ${d===this._deck?'selected':''}>${d==='under'?'UNDER':d}</option>`).join('')}
      </select>
      <div class="modal-plan-viewer" id="loc-plan-viewer">
        <canvas id="loc-plan-canvas"></canvas>
        <div class="plan-controls">
          <button class="plan-ctrl" onclick="LocationOSC.zoom(1.45)">+</button>
          <button class="plan-ctrl" onclick="LocationOSC.zoom(0.69)">–</button>
          <button class="plan-ctrl" onclick="LocationOSC.resetView()">⟲</button>
        </div>
        <div class="modal-plan-hint">Tap pour placer l'équipe (pont ${this._deck})</div>
        <div class="modal-plan-feedback" id="loc-plan-feedback"></div>
      </div>
      <button class="btn btn-gold btn-block" id="loc-plan-validate" onclick="LocationOSC.confirmPlanSelection()" disabled>Valider la position</button>`;
  },
  setDeck(d){ this._deck = this._normalizeDeck(d); this._draftSelection = null; this._render(); },
  _initPlanCanvas(){
    const viewer = document.getElementById('loc-plan-viewer');
    const canvas = document.getElementById('loc-plan-canvas');
    if (!viewer || !canvas) return;
    canvas.width = viewer.clientWidth; canvas.height = viewer.clientHeight;
    if (!this.img) {
      this.img = new Image();
      this.img.onload = () => { this._fitToDeck(this._deck); this._redraw(); };
      this.img.src = 'assets/img/plans/GaLCC_page_01.png';
    }
    if (this.img && this.img.complete && this.img.naturalWidth) this._fitToDeck(this._deck);
    this._redraw();
    this._bindEvents(canvas);
  },
  resetView(){ this._fitToDeck(this._deck); this._redraw(); },
  zoom(factor){
    this._view.zoom = Math.max(0.3, Math.min(this.MAX_ZOOM, (this._view.zoom || 1) * factor));
    this._redraw();
  },
  _bindEvents(canvas){
    if (canvas._bound) return;
    canvas._bound = true;
    let dragging = false;
    let moved = false;
    let lastX = 0;
    let lastY = 0;
    const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      this._activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this._activePointers.size === 1) {
        dragging = true;
        moved = false;
        lastX = e.clientX;
        lastY = e.clientY;
      } else if (this._activePointers.size === 2) {
        dragging = false;
        const pts = [...this._activePointers.values()];
        this._pinchStartDist = dist(pts[0], pts[1]);
        this._pinchStartZoom = this._view.zoom || 1;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!this._activePointers.has(e.pointerId)) return;
      this._activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this._activePointers.size === 2) {
        const pts = [...this._activePointers.values()];
        const d = dist(pts[0], pts[1]);
        if (this._pinchStartDist > 0) {
          this._view.zoom = Math.max(0.3, Math.min(this.MAX_ZOOM, this._pinchStartZoom * (d / this._pinchStartDist)));
          this._redraw();
        }
        return;
      }
      if (dragging) {
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        this._view.panX += dx;
        this._view.panY += dy;
        lastX = e.clientX;
        lastY = e.clientY;
        this._redraw();
      }
    });

    const endPointer = (e) => {
      const pt = this._activePointers.get(e.pointerId);
      this._activePointers.delete(e.pointerId);
      if (this._activePointers.size < 2) this._pinchStartDist = 0;
      if (this._activePointers.size === 0 && dragging && !moved && pt) {
        const rect = canvas.getBoundingClientRect();
        this.placeHere(pt.x - rect.left, pt.y - rect.top);
      }
      dragging = false;
    };
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoom(e.deltaY < 0 ? 1.2 : 0.84);
    }, { passive:false });
  },
  _redraw(){
    const canvas = document.getElementById('loc-plan-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0c1620'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (this.img && this.img.complete && this.img.naturalWidth) {
      const scaleFit = Math.min(canvas.width / this.img.naturalWidth, canvas.height / this.img.naturalHeight);
      const scale = scaleFit * (this._view?.zoom || 1);
      const w = this.img.naturalWidth * scale, h = this.img.naturalHeight * scale;
      const x = (canvas.width - w) / 2 + (this._view?.panX || 0);
      const y = (canvas.height - h) / 2 + (this._view?.panY || 0);
      ctx.drawImage(this.img, x, y, w, h);
      this._lastView = { ox: x, oy: y, w, h };

      // Draw deck polygons so the operator can target a real local area.
      const spaces = this._deckSpaces(this._deck);
      spaces.forEach(space => {
        const poly = Array.isArray(space.poly) ? space.poly : [];
        if (poly.length < 3) return;
        ctx.beginPath();
        poly.forEach((pt, idx) => {
          const p = this._sourceToCanvas(pt[0], pt[1]);
          if (!p) return;
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(92,184,214,0.08)';
        ctx.strokeStyle = 'rgba(92,184,214,0.35)';
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();
      });
    }
    const marker = STATE.plans.markers.find(m => m.iconId === this._iconId && this._normalizeDeck(m.deck) === this._normalizeDeck(this._deck));
    const draft = this._draftSelection && this._normalizeDeck(this._draftSelection.deck) === this._normalizeDeck(this._deck)
      ? this._draftSelection
      : null;
    const drawMarker = draft || marker;
    if (drawMarker) {
      let mx = Number(drawMarker.x), my = Number(drawMarker.y);
      if (Number.isFinite(Number(drawMarker.sx)) && Number.isFinite(Number(drawMarker.sy))) {
        const p = this._sourceToCanvas(Number(drawMarker.sx), Number(drawMarker.sy));
        if (p) { mx = p.x; my = p.y; }
      }
      ctx.font = '26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📍', mx, my);
    }
  },
  placeHere(x, y){
    const src = this._canvasToSource(x, y);
    const sx = src ? src.sx : null;
    const sy = src ? src.sy : null;
    const hit = src ? this._findSpaceAtSource(this._deck, sx, sy) : null;
    const value = hit && hit.name ? hit.name : `${this._deck} (plan)`;
    this._draftSelection = { x, y, sx, sy, deck: this._deck, value };
    const btn = document.getElementById('loc-plan-validate');
    if (btn) btn.disabled = false;
    this._showFeedback(hit ? `Local détecté: ${value}` : `Position prête sur ${this._deck}` , hit ? 'ok' : 'warn');
    this._redraw();
  },
  confirmPlanSelection(){
    const draft = this._draftSelection;
    if (!draft) {
      this._showFeedback('Sélectionnez une position avant de valider', 'warn');
      return;
    }
    // Single-placement policy — move this team's marker rather than stacking duplicates.
    STATE.plans.markers = STATE.plans.markers.filter(m => m.iconId !== this._iconId);
    STATE.plans.markers.push({
      id:'m'+Date.now(),
      iconId:this._iconId,
      deck:draft.deck,
      x:draft.x,
      y:draft.y,
      sx:draft.sx,
      sy:draft.sy,
    });
    NetOSC.sendStateSyncNow();
    if (this._callback) this._callback(draft.value);
    this._draftSelection = null;
    ModalOSC.close();
    if (UI.currentPage === 'plans') Pages.render_plans();
  },
};

/* ============================================================
   ChatOSC — header chat button — Bridge Comms preset/custom
   messages, same preset list as LCC Sentinel 3's OSCModule
   ============================================================ */
const ChatOSC = {
  PRESETS: [
    'Zone secured — no casualties',
    'Fire under control — cooling operations',
    'Need reinforcement — send FS team',
    'BA sets running low — send replacement',
    'Team withdrawn — boundary set',
    'Casualty on scene — request medical',
    'Evacuation complete — all zones clear',
  ],
  unread: 0,
  toggleDrawer(){
    const drawer = document.getElementById('chat-drawer');
    const overlay = document.getElementById('chat-drawer-overlay');
    const show = !drawer.classList.contains('show');
    drawer.classList.toggle('show', show);
    overlay.classList.toggle('show', show);
    if (show) { this.unread = 0; this.updateBadge(); this.renderPresets(); this.renderLog(); }
  },
  renderPresets(){
    const el = document.getElementById('chat-presets');
    if (el) el.innerHTML = this.PRESETS.map((m,i) => `<button class="btn btn-ghost" style="justify-content:flex-start;font-size:11px" onclick="ChatOSC.send(ChatOSC.PRESETS[${i}])">${escapeHtml(m)}</button>`).join('');
  },
  renderLog(){
    const el = document.getElementById('chat-log');
    if (el) el.innerHTML = STATE.oscMessages.slice(0,30).map(m => `<div class="notif-entry"><span class="ne-time">${m.time} — ${escapeHtml(m.from||'OSC')}</span>${escapeHtml(m.text)}</div>`).join('');
  },
  send(text){
    const time = nowTime();
    STATE.oscMessages.unshift({ time, text, from:'OSC' });
    STATE.oscMessages = STATE.oscMessages.slice(0, 50);
    NetOSC.send({ type:'OSC_MESSAGE', payload:{ text, time } });
    this.renderLog();
    UI.showToast('OSC → Bridge: ' + text);
  },
  sendCustom(){
    const input = document.getElementById('chat-input');
    if (!input || !input.value.trim()) return;
    this.send(input.value.trim());
    input.value = '';
  },
  receive(){
    this.unread++;
    this.updateBadge();
    if (document.getElementById('chat-drawer').classList.contains('show')) this.renderLog();
  },
  updateBadge(){
    const badge = document.getElementById('chat-badge');
    if (!badge) return;
    badge.style.display = this.unread ? 'flex' : 'none';
    badge.textContent = this.unread > 99 ? '99+' : String(this.unread);
  },
};

   Bootstrap
   ============================================================ */
window.addEventListener('load', () => {
  SpacesData.init().then(() => {
    const src = document.getElementById('plan-zones-source');
    if (src) src.textContent = SpacesData.describeSource();
    if (UI.currentPage === 'plans') Pages.render_plans();
  }).catch(() => {});
  UI.init();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw-osc.js').catch(() => {});
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window._pwaInstallPrompt = e;
  });
});
